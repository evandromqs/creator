name: Render Video

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Template de vídeo a compilar e renderizar'
        required: true
        default: 'quiz-mobile'
        type: choice
        options:
          - quiz-mobile
          - kinetic-shorts
          - story-loop
          - tech-viral
          - commercial-ad
      video_title:
        description: 'Nome ou identificador do vídeo'
        required: false
        default: 'video'
      custom_data:
        description: 'Dados JSON customizados do quiz ou texto do roteiro'
        required: false
        default: ''
      theme:
        description: 'Tema visual do Quiz (roxo, neon, cyberpunk, esmeralda, solar)'
        required: false
        default: 'roxo'
      mode:
        description: 'Modo de execução (full = áudio + vídeo MP4, audio_only = apenas áudio MP3)'
        required: false
        default: 'full'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Instalar dependências
        run: npm install

      - name: Injetar dados customizados (se fornecido)
        run: |
          node -e '
            const fs = require("fs");
            const tpl = "${{ inputs.template }}";
            const customData = process.env.CUSTOM_DATA;
            if (customData && customData.trim()) {
              if (tpl === "quiz-mobile") {
                fs.writeFileSync("templates/quiz-mobile/quiz3-francisca.json", customData, "utf-8");
                console.log("Perguntas customizadas salvas em templates/quiz-mobile/quiz3-francisca.json");
              } else {
                fs.writeFileSync("audio/roteiro.txt", customData, "utf-8");
                console.log("Roteiro customizado salvo em audio/roteiro.txt");
              }
            }
          '
        env:
          CUSTOM_DATA: ${{ inputs.custom_data }}

      - name: Gerar áudio do Quiz (caso template seja quiz-mobile)
        if: ${{ inputs.template == 'quiz-mobile' }}
        run: |
          node scripts/generate_quiz_audio.cjs templates/quiz-mobile/quiz3-francisca.json audio/quiz-mix.mp3 transcript/quiz-timings.json

      - name: Salvar áudio MP3 como artefato
        if: ${{ inputs.template == 'quiz-mobile' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video_title || 'quiz' }}-audio
          path: audio/quiz-mix.mp3
          retention-days: 14

      - name: Gerar áudio genérico via Edge TTS (se roteiro.txt fornecido)
        if: ${{ inputs.template != 'quiz-mobile' }}
        run: |
          if [ -f "audio/roteiro.txt" ]; then
            node scripts/generate_audio_edgetts.cjs pt-BR-AntonioNeural audio/roteiro.txt audio/narracao.mp3 transcript/words.json
          fi

      - name: Compilar template selecionado
        if: ${{ inputs.mode != 'audio_only' }}
        run: node scripts/build.cjs --template=${{ inputs.template }} --theme=${{ inputs.theme || 'roxo' }}

      - name: Renderizar vídeo via Hyperframes
        if: ${{ inputs.mode != 'audio_only' }}
        run: npx --yes hyperframes@0.9.22 render -o output/video.mp4

      - name: Salvar vídeo gerado como artefato
        if: ${{ inputs.mode != 'audio_only' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video_title || inputs.template }}
          path: output/video.mp4
          retention-days: 14
