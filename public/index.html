                          <div className="q-list">
                            {kineticScenes.map((sc, sIdx) => (
                              <div key={sIdx} className={`q-card ${activeKineticIdx === sIdx ? 'selected' : ''}`} onClick={() => setActiveKineticIdx(sIdx)}>
                                <div className="q-card-top">
                                  <span className="q-badge">Cena {sIdx + 1}</span>
                                  <div className="q-actions" onClick={e => e.stopPropagation()}>
                                    <button type="button" className="icon-btn" onClick={() => moveKineticScene(sIdx, -1)}>↑</button>
                                    <button type="button" className="icon-btn" onClick={() => moveKineticScene(sIdx, 1)}>↓</button>
                                    <button type="button" className="icon-btn del" onClick={() => deleteKineticScene(sIdx)}>🗑️</button>
                                  </div>
                                </div>
                                <div className="row-2" style={{ marginBottom: '6px' }}>
                                  <select value={sc.layout || 'impact'} onChange={e => updateKineticScene(sIdx, { layout: e.target.value })}>
                                    {KINETIC_LAYOUTS.map(l => <option key={l.id} value={l.id}>{l.label}</option>)}
                                  </select>
                                  <select value={sc.accent || 'gold'} onChange={e => updateKineticScene(sIdx, { accent: e.target.value })}>
                                    {Object.entries(KINETIC_ACCENTS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                                  </select>
                                </div>
                                <div className="row-2" style={{ marginBottom: '6px' }}>
                                  <input type="text" value={sc.eyebrow || ''} onChange={e => updateKineticScene(sIdx, { eyebrow: e.target.value })} placeholder="Eyebrow (ex: VOCÊ SABIA?)" />
                                  <input type="text" value={sc.headline || ''} onChange={e => updateKineticScene(sIdx, { headline: e.target.value })} placeholder="Manchete principal" style={{ fontWeight: 700 }} />
                                </div>
                                <div className="row-2" style={{ marginBottom: '6px' }}>
                                  <input type="text" value={sc.subheadline || ''} onChange={e => updateKineticScene(sIdx, { subheadline: e.target.value })} placeholder="Subtítulo visual" />
                                  {sc.layout === 'stat' ? (
                                    <input type="number" value={sc.statNumber || ''} onChange={e => updateKineticScene(sIdx, { statNumber: Number(e.target.value) })} placeholder="Número animado (ex: 3000)" />
                                  ) : (sc.layout === 'split_vs' || sc.layout === 'cta') ? (
                                    <div style={{ display: 'flex', gap: '6px' }}>
                                      <input type="text" value={sc.vsLeft || ''} onChange={e => updateKineticScene(sIdx, { vsLeft: e.target.value })} placeholder="Lado A" />
                                      <input type="text" value={sc.vsRight || ''} onChange={e => updateKineticScene(sIdx, { vsRight: e.target.value })} placeholder="Lado B" />
                                    </div>
                                  ) : (
                                    <input type="text" value={sc.badge || ''} onChange={e => updateKineticScene(sIdx, { badge: e.target.value })} placeholder="Selo / Badge opcional" />
                                  )}
                                </div>
                                <input type="text" value={sc.narration || ''} onChange={e => updateKineticScene(sIdx, { narration: e.target.value })} placeholder="Texto da narração desta cena..." />
                              </div>
                            ))}
                          </div>
                        ) : (
                          <>
                            <textarea value={kineticJson} onChange={e => handleKineticJsonChange(e.target.value)} spellCheck="false" />
                            {kineticJsonErr && <div style={{ color: 'var(--danger)', fontSize: '0.75rem', marginTop: '4px' }}>⚠️ {kineticJsonErr}</div>}
                          </>
                        )
                      ) : template === 'story-loop' ? (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                          <div><label>Título da História</label><input type="text" value={storyData.title} onChange={e => setStoryData({ ...storyData, title: e.target.value })} /></div>
                          {(storyData.scenes || []).map((sc, idx) => (
                            <div key={idx} className="q-card">
                              <div className="row-2" style={{ marginBottom: '6px' }}>
                                <input type="text" value={sc.eyebrow} onChange={e => setStoryData({ ...storyData, scenes: storyData.scenes.map((s, i) => (i === idx ? { ...s, eyebrow: e.target.value } : s)) })} />
                                <input type="text" value={sc.title} onChange={e => setStoryData({ ...storyData, scenes: storyData.scenes.map((s, i) => (i === idx ? { ...s, title: e.target.value } : s)) })} />
                              </div>
                              <input type="text" value={sc.text} onChange={e => setStoryData({ ...storyData, scenes: storyData.scenes.map((s, i) => (i === idx ? { ...s, text: e.target.value } : s)) })} />
                            </div>
                          ))}
                        </div>
                      ) : template === 'commercial-ad' ? (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                          <div className="row-3">
                            <div><label>Tag</label><input type="text" value={adData.tag} onChange={e => setAdData({ ...adData, tag: e.target.value })} /></div>
                            <div><label>Chamada</label><input type="text" value={adData.headline} onChange={e => setAdData({ ...adData, headline: e.target.value })} /></div>
                            <div><label>Destaque</label><input type="text" value={adData.highlight} onChange={e => setAdData({ ...adData, highlight: e.target.value })} /></div>
                          </div>
                          <div className="row-2">
                            <div><label>Subtítulo</label><input type="text" value={adData.sub} onChange={e => setAdData({ ...adData, sub: e.target.value })} /></div>
                            <div><label>Botão CTA</label><input type="text" value={adData.ctaButton} onChange={e => setAdData({ ...adData, ctaButton: e.target.value })} /></div>
                          </div>
                          <div className="row-3">
                            {(adData.cards || []).map((c, idx) => <div key={idx}><label>Benefício {idx + 1}</label><input type="text" value={c} onChange={e => setAdData({ ...adData, cards: adData.cards.map((v, i) => (i === idx ? e.target.value : v)) })} /></div>)}
                          </div>
                          <div><label>Locução do Anúncio</label><textarea className="prose" style={{ minHeight: '90px' }} value={adData.narrationText} onChange={e => setAdData({ ...adData, narrationText: e.target.value })} /></div>
                        </div>
                      ) : (
                        <textarea className="prose" value={scriptText} onChange={e => setScriptText(e.target.value)} />
                      )}

                      <div className="audio-panel">
                        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                          <button className="btn-ai" type="button" onClick={handleGenerateAudio} disabled={audioLoading}>
                            {audioLoading ? '⏳ Gerando Áudio...' : template === 'quiz-mobile' ? '🔊 Gerar Áudio Completo (~3s)' : '🔊 Gerar Narração com IA'}
                          </button>
                          {(template === 'quiz-mobile' || template === 'kinetic-shorts') && (!instantPlaying ? (
                            <button className="btn-secondary" type="button" onClick={handleInstantPreview}>⚡ Prévia Ao Vivo (Simulador)</button>
                          ) : (
                            <button className="btn-secondary" type="button" onClick={stopInstantPreview} style={{ color: '#f87171' }}>⏹ Parar Prévia</button>
                          ))}
                        </div>
                        {(audioLoading || audioProgress > 0) && (
                          <div className="progress-wrap">
                            <div className="progress-meta"><span>{audioStatus}</span><span style={{ color: audioProgress === 100 ? '#34d399' : '#a5b4fc' }}>{audioProgress}%</span></div>
                            <div className="progress-track"><div className="progress-fill" style={{ width: `${audioProgress}%` }} /></div>
                          </div>
                        )}
                        {!audioLoading && audioProgress === 0 && audioStatus && <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '8px' }}>{audioStatus}</div>}
                        {audioSrc && <audio ref={audioRef} src={audioSrc} controls style={{ width: '100%', marginTop: '10px' }} />}
                      </div>

                      <button className="btn-primary" type="button" onClick={handleDispatchRender} disabled={dispatchLoading}>
                        {dispatchLoading ? <div className="spinner" /> : <span>🚀</span>}
                        <span>{dispatchLoading ? 'Enviando...' : 'Disparar Renderização na Esteira'}</span>
                      </button>
                    </div>
                  </div>

                  {/* Preview Sticky */}
                  <div className="sticky-preview">
                    <div className="card">
                      <div className="step-header">
                        <div className="step-title"><span>📱 Preview 9:16</span></div>
                        {template === 'quiz-mobile' && <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>{THEMES[visualTheme]?.label}</span>}
                      </div>
                      {template === 'quiz-mobile' ? (
                        <QuizPhonePreview
                          questions={questions} activeIdx={activeIdx} themeKey={visualTheme} clockValue={simClock} revealed={simRevealed}
                          onPrev={() => { setSimRevealed(false); setSimClock(5); setActiveIdx(i => (i - 1 + questions.length) % questions.length); }}
                          onNext={() => { setSimRevealed(false); setSimClock(5); setActiveIdx(i => (i + 1) % questions.length); }}
                          onToggleReveal={() => { setSimRevealed(v => !v); setSimClock(simRevealed ? 5 : 0); }}
                        />
                      ) : template === 'kinetic-shorts' ? (
                        <KineticPhonePreview
                          scenes={kineticScenes}
                          activeIdx={activeKineticIdx}
                          onPrev={() => setActiveKineticIdx(i => (i - 1 + kineticScenes.length) % kineticScenes.length)}
                          onNext={() => setActiveKineticIdx(i => (i + 1) % kineticScenes.length)}
                        />
                      ) : (
                        <SecondaryPreviewCard template={template} storyData={storyData} adData={adData} scriptText={scriptText} />
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* SEÇÃO 2: PRODUÇÃO EM LOTE */}
              {activeSection === 'batch' && (
                <div className="card" style={{ maxWidth: '820px' }}>
                  <div className="step-header"><div className="step-title">⚡ Fábrica em Lote (Batch Render)</div></div>
                  <div className="row-3" style={{ marginBottom: '12px' }}>
                    <div>
                      <label>Template do Lote</label>
                      <select value={batchTemplate} onChange={e => {
                        const v = e.target.value;
                        setBatchTemplate(v);
                        if (v === 'kinetic-shorts' && Number(batchCount) < 10) setBatchCount(10);
                        if (v === 'quiz-mobile' && Number(batchCount) > 10) setBatchCount(6);
                      }}>
                        {TEMPLATES.map(t => <option key={t.id} value={t.id}>{t.icon} {t.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label>Tema Visual (Quiz)</label>
                      <select value={batchTheme} onChange={e => setBatchTheme(e.target.value)} disabled={batchTemplate !== 'quiz-mobile'}>
                        {Object.entries(THEMES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label>{batchTemplate === 'kinetic-shorts' ? 'Cenas (10–12)' : 'Perguntas por Quiz'}</label>
                      <input type="number" min={batchTemplate === 'kinetic-shorts' ? 10 : 1} max={batchTemplate === 'kinetic-shorts' ? 12 : 10} value={batchCount} onChange={e => setBatchCount(e.target.value)} disabled={batchTemplate !== 'quiz-mobile' && batchTemplate !== 'kinetic-shorts'} />
                    </div>
                  </div>
                  <div className="form-group">
                    <label>Lista de Temas (um por linha ou separados por vírgula)</label>
                    <textarea className="prose" value={batchTopicsText} onChange={e => setBatchTopicsText(e.target.value)} placeholder="Ex:&#10;Curiosidades do Brasil&#10;Filmes de Heróis&#10;História do Egito" />
                  </div>
                  {batchRunning && (
                    <div className="progress-wrap" style={{ marginBottom: '14px' }}>
                      <div className="progress-meta"><span>{batchProgress.label}</span><span>{Math.round((batchProgress.cur / Math.max(1, batchProgress.total)) * 100)}%</span></div>
                      <div className="progress-track"><div className="progress-fill" style={{ width: `${Math.round((batchProgress.cur / Math.max(1, batchProgress.total)) * 100)}%` }} /></div>
                    </div>
                  )}
                  <button className="btn-primary" type="button" onClick={handleBatchRun} disabled={batchRunning}>
                    {batchRunning ? <div className="spinner" /> : <span>⚡</span>}
                    <span>{batchRunning ? 'Gerando e Disparando Lote...' : 'Gerar Roteiros com Groq & Disparar Todos'}</span>
                  </button>
                </div>
              )}

              {/* SEÇÃO 3: ESTEIRA KANBAN */}
              {activeSection === 'kanban' && (
                <div>
                  <div className="kpi-grid">
                    <div className="kpi-card"><div><div className="kpi-label">Total na Esteira</div><div className="kpi-value accent">{ghToken ? kpis.total : '—'}</div></div><span>📦</span></div>
                    <div className="kpi-card"><div><div className="kpi-label">Em Produção</div><div className="kpi-value warning">{ghToken ? kpis.inFlight : '—'}</div></div><span>⚙️</span></div>
                    <div className="kpi-card"><div><div className="kpi-label">Concluídos</div><div className="kpi-value success">{ghToken ? kpis.success : '—'}</div></div><span>✅</span></div>
                    <div className="kpi-card"><div><div className="kpi-label">Taxa de Sucesso</div><div className="kpi-value success">{ghToken ? `${kpis.rate}%` : '—'}</div></div><span>📈</span></div>
                  </div>

                  {audioSrc && (
                    <div className="card" style={{ padding: '14px 18px' }}>
                      <div style={{ fontSize: '0.78rem', fontWeight: 700, marginBottom: '6px', color: '#34d399' }}>{audioStatus}</div>
                      <audio ref={audioRef} src={audioSrc} controls style={{ width: '100%' }} />
                    </div>
                  )}

                  {!ghToken ? (
                    <div className="card empty-state">Configure seu GitHub Token em <strong>🔐 Integrações</strong> para visualizar o Kanban.</div>
                  ) : runsError ? (
                    <div className="card empty-state" style={{ color: 'var(--danger)' }}>{runsError}</div>
                  ) : (
                    <div className="kanban-grid">
                      {[
                        { title: '⏳ Na Fila', items: queuedRuns, badge: queuedRuns.length },
                        { title: '⚙️ Renderizando', items: activeRuns, badge: activeRuns.length },
                        { title: '✅ Finalizados', items: doneRuns, badge: doneRuns.length },
                      ].map((col, ci) => (
                        <div key={ci} className="kanban-col">
                          <div className="kanban-col-head"><span>{col.title}</span><span className="nav-pill">{col.badge}</span></div>
                          {col.items.length === 0 ? (
                            <div className="empty-state">Nenhum item</div>
                          ) : (
                            col.items.map(run => {
                              let statusClass = 'status-queued', statusLabel = 'Na Fila', s1 = 'done', s2 = 'active', s3 = '';
                              if (run.status === 'in_progress') { statusClass = 'status-in_progress'; statusLabel = 'Renderizando'; s2 = 'done'; s3 = 'active'; }
                              else if (run.status === 'completed') {
                                if (run.conclusion === 'success') { statusClass = 'status-completed'; statusLabel = 'Pronto!'; s2 = 'done'; s3 = 'done'; }
                                else { statusClass = 'status-failed'; statusLabel = 'Falhou'; s2 = 'done'; s3 = 'fail'; }
                              }
                              const created = new Date(run.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                              const isOk = run.status === 'completed' && run.conclusion === 'success';
                              return (
                                <div key={run.id} className="run-item">
                                  <div className="run-header"><span className={`badge-status ${statusClass}`}>{statusLabel}</span><span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>{created}</span></div>
                                  <div className="run-title">{run.display_title || 'Render Video'}</div>
                                  <div className="run-meta">Execução #{run.run_number}</div>
                                  <div className="pipeline-steps"><div className={`step-bar ${s1}`} /><div className={`step-bar ${s2}`} /><div className={`step-bar ${s3}`} /></div>
                                  <div className="run-actions">
                                    {isOk && (
                                      <>
                                        <button type="button" className="run-btn" onClick={() => handlePlayRunAudio(run.id)}>🔊 Ouvir MP3</button>
                                        <button type="button" className="run-btn download" onClick={() => handleDownloadRun(run.id)}>⬇️ Baixar (.zip)</button>
                                      </>
                                    )}
                                    <a href={run.html_url} target="_blank" rel="noreferrer" className="run-btn">Log</a>
                                  </div>
                                </div>
                              );
                            })
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* SEÇÃO 4: ROTEIROS SALVOS */}
              {activeSection === 'history' && (
                <div className="card">
                  <div className="step-header">
                    <div className="step-title">🗂️ Roteiros Salvos Localmente ({savedScripts.length})</div>
                    {savedScripts.length > 0 && (
                      <button className="btn-secondary" onClick={() => { setSavedScripts([]); localStorage.removeItem('creator_saved_scripts'); notify('info', 'Histórico limpo'); }}>
                        Limpar Histórico
                      </button>
                    )}
                  </div>
                  {savedScripts.length === 0 ? (
                    <div className="empty-state">Nenhum roteiro salvo ainda. Gere com a IA no Estúdio ou clique em "💾 Salvar".</div>
                  ) : (
                    <div className="row-2">
                      {savedScripts.map(item => (
                        <div key={item.id} className="run-item">
                          <div className="run-header">
                            <span className="q-badge">{TEMPLATES.find(t => t.id === item.template)?.name || item.template}</span>
                            <span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>{new Date(item.createdAt).toLocaleString()}</span>
                          </div>
                          <div className="run-title">{item.title}</div>
                          <div className="run-meta">Assunto: {item.topic || 'Personalizado'}</div>
                          <div className="run-actions">
                            <button type="button" className="run-btn download" onClick={() => loadSavedScript(item)}>✏️ Abrir no Estúdio</button>
                            <button type="button" className="run-btn" onClick={() => {
                              const next = savedScripts.filter(x => x.id !== item.id);
                              setSavedScripts(next); localStorage.setItem('creator_saved_scripts', JSON.stringify(next));
                            }}>🗑️ Excluir</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* SEÇÃO 5: VOZES & SFX */}
              {activeSection === 'voices' && (
                <div className="row-2">
                  <div className="card">
                    <div className="step-header">
                      <div className="step-title">🎙️ Laboratório Edge TTS (Cloudflare Worker)</div>
                      {voiceLatency !== null && <span className="nav-pill ok">{voiceLatency} ms</span>}
                    </div>
                    <div className="form-group">
                      <label>Texto para Teste Rápido</label>
                      <textarea className="prose" style={{ minHeight: '95px' }} value={voiceTestText} onChange={e => setVoiceTestText(e.target.value)} />
                    </div>
                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                      <button type="button" className="btn-ai" onClick={() => testVoiceLatency('pt-BR-FranciscaNeural', '0.9')}>▶️ Testar Francisca (0.9x)</button>
                      <button type="button" className="btn-secondary" onClick={() => testVoiceLatency('pt-BR-AntonioNeural', '0.95')}>▶️ Testar Antonio (0.95x)</button>
                    </div>
                  </div>

                  <div className="card">
                    <div className="step-header"><div className="step-title">🔔 Efeitos Sonoros Oficiais (SFX Limpos)</div></div>
                    {[
                      { name: 'Tic-Tac Contínuo (4.70s)', path: 'sfx/tic-tac.mp3', desc: 'Loop contínuo durante contagem 5..1' },
                      { name: 'Tique Único (0.25s)', path: 'sfx/tick.mp3', desc: 'Corte limpo extraído do tic-tac' },
                      { name: 'Alarme de Revelação (0.78s)', path: 'sfx/trim_alarm.mp3', desc: 'Sino disparado na resposta certa' },
                    ].map(s => (
                      <div key={s.path} className="run-item" style={{ marginBottom: '10px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px' }}>
                        <div><div className="run-title">{s.name}</div><div className="run-meta" style={{ marginBottom: 0 }}>{s.desc}</div></div>
                        <button type="button" className="btn-secondary" onClick={() => { const a = new Audio(s.path); a.play(); }}>▶️ Ouvir</button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* SEÇÃO 6: INTEGRAÇÕES & CHAVES */}
              {activeSection === 'settings' && (
                <div className="row-2" style={{ maxWidth: '920px' }}>
                  <div className="card">
                    <div className="step-header"><div className="step-title">🐙 GitHub Actions Token</div><span className={`nav-pill ${ghToken ? 'ok' : 'warn'}`}>{ghToken ? 'Salvo' : 'Pendente'}</span></div>
                    <div className="form-group">
                      <label>Personal Access Token (escopo <code>workflow</code>)</label>
                      <input type="password" value={ghDraft} onChange={e => setGhDraft(e.target.value)} placeholder="ghp_... ou gho_..." autoComplete="off" />
                    </div>
                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                      <button type="button" className="btn-ai" onClick={() => {
                        const v = ghDraft.trim();
                        if (v) { localStorage.setItem('creator_gh_token', v); setGhToken(v); fetchRuns(v); notify('success', 'GitHub Token salvo!'); }
                        else { localStorage.removeItem('creator_gh_token'); setGhToken(''); setRuns([]); notify('info', 'GitHub Token removido'); }
                      }}>💾 Salvar</button>
                      <button type="button" className="btn-secondary" onClick={testGithubConnection}>⚡ Testar Conexão</button>
                    </div>
                  </div>

                  <div className="card">
                    <div className="step-header"><div className="step-title">🧠 Groq API Key</div><span className={`nav-pill ${groqKey ? 'ok' : 'warn'}`}>{groqKey ? 'Salva' : 'Pendente'}</span></div>
                    <div className="form-group">
                      <label>Chave API do Groq Console</label>
                      <input type="password" value={groqDraft} onChange={e => setGroqDraft(e.target.value)} placeholder="gsk_..." autoComplete="off" />
                    </div>
                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                      <button type="button" className="btn-ai" onClick={() => {
                        const v = groqDraft.trim();
                        if (v) { localStorage.setItem('creator_groq_key', v); setGroqKey(v); notify('success', 'Groq API Key salva!'); }
                        else { localStorage.removeItem('creator_groq_key'); setGroqKey(''); notify('info', 'Groq API Key removida'); }
                      }}>💾 Salvar</button>
                      <button type="button" className="btn-secondary" onClick={testGroqConnection}>⚡ Testar Conexão</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
