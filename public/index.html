<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Studio — Plataforma de Automação de Vídeos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --sidebar: #0b1120;
      --surface: #0f172a;
      --card: #111827;
      --card-border: #1e293b;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* Dark Custom Scrollbars */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #070b14; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* App Shell */
    .app-shell {
      height: 100vh;
      display: grid;
      grid-template-columns: 260px 1fr;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 18px 14px;
      overflow-y: auto;
      z-index: 40;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px 18px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
    }
    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.35);
      flex-shrink: 0;
    }
    .brand-name { font-weight: 800; font-size: 1rem; letter-spacing: -0.3px; }
    .brand-sub { font-size: 0.68rem; color: var(--text-muted); font-weight: 600; }

    .nav-group { margin-bottom: 18px; }
    .nav-group-label {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: #64748b;
      padding: 0 10px 7px;
    }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.16s;
      margin-bottom: 3px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.35);
      color: #c7d2fe;
      font-weight: 700;
    }
    .nav-left { display: flex; align-items: center; gap: 9px; }
    .nav-pill {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: #1e293b;
      color: #cbd5e1;
    }
    .nav-pill.warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .nav-pill.ok { background: rgba(16, 185, 129, 0.2); color: #34d399; }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .conn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.74rem;
      color: var(--text-muted);
      padding: 3px 6px;
    }
    .dot-ind { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot-ind.ok { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot-ind.warn { background: var(--warning); }

    /* Workspace Main */
    .workspace {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top right, rgba(99,102,241,0.07), transparent 45%), var(--bg);
    }
    .topbar {
      height: 60px;
      border-bottom: 1px solid var(--card-border);
      background: rgba(11, 17, 32, 0.78);
      backdrop-filter: blur(12px);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .menu-toggle {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .page-title { font-size: 1.02rem; font-weight: 800; letter-spacing: -0.2px; }
    .page-sub { font-size: 0.74rem; color: var(--text-muted); }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 22px 24px 48px;
    }

    @media (max-width: 960px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        left: -275px;
        top: 0;
        bottom: 0;
        width: 260px;
        transition: left 0.22s ease;
      }
      .sidebar.open { left: 0; box-shadow: 20px 0 60px rgba(0,0,0,0.7); }
      .menu-toggle { display: inline-flex; }
    }

    /* Toasts */
    .toast-stack {
      position: fixed;
      top: 16px;
      right: 18px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-width: 360px;
      width: calc(100vw - 32px);
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: #111827;
      border: 1px solid #334155;
      border-left: 4px solid var(--accent);
      border-radius: 11px;
      padding: 12px 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      animation: slideIn 0.2s ease;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }
    .toast-title { font-size: 0.82rem; font-weight: 800; margin-bottom: 2px; }
    .toast-msg { font-size: 0.76rem; color: var(--text-muted); line-height: 1.35; }
    .toast-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; line-height: 1; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: translateX(0); } }

    /* Cards & Controls */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
    }
    .step-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .step-title { display: flex; align-items: center; gap: 10px; font-size: 0.96rem; font-weight: 800; }
    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--accent-soft);
      color: #a5b4fc;
      font-size: 0.76rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .studio-grid {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1180px) { .studio-grid { grid-template-columns: 1fr; } }

    .sticky-preview { position: sticky; top: 0; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    @media (max-width: 820px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kpi-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-value { font-size: 1.55rem; font-weight: 800; margin-top: 2px; }
    .kpi-value.accent { color: #818cf8; }
    .kpi-value.warning { color: var(--warning); }
    .kpi-value.success { color: var(--success); }
    .kpi-value.danger { color: var(--danger); }

    /* Kanban */
    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1080px) { .kanban-grid { grid-template-columns: 1fr; } }
    .kanban-col {
      background: #0b1120;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .kanban-col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.84rem;
      font-weight: 800;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
    input, select, textarea {
      width: 100%;
      background: #090e1a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 9px 11px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }
    textarea { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; min-height: 185px; resize: vertical; line-height: 1.5; }
    textarea.prose { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.88rem; min-height: 145px; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .row-2, .row-3 { grid-template-columns: 1fr; } }

    .templates-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
    @media (max-width: 720px) { .templates-grid { grid-template-columns: repeat(2, 1fr); } }
    .tpl-btn {
      background: #090e1a;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 6px;
      cursor: pointer;
      text-align: center;
      color: var(--text);
      transition: all 0.15s;
    }
    .tpl-btn:hover { border-color: #475569; transform: translateY(-1px); }
    .tpl-btn.active { border-color: var(--accent); background: var(--accent-soft); }
    .tpl-btn .icon { font-size: 1.2rem; display: block; margin-bottom: 3px; }
    .tpl-btn .name { font-size: 0.74rem; font-weight: 800; display: block; }
    .tpl-btn .desc { font-size: 0.64rem; color: var(--text-muted); margin-top: 2px; display: block; }

    .chips-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip-btn {
      background: #090e1a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.71rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chip-btn:hover { border-color: #10b981; color: #34d399; }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
    }
    .btn-primary:hover { opacity: 0.95; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn-secondary:hover { background: #334155; }
    .btn-secondary:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-ai {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-ai:hover { opacity: 0.92; }
    .btn-ai:disabled { opacity: 0.55; cursor: not-allowed; }

    .audio-panel {
      background: #090e1a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 13px;
      margin: 12px 0 14px;
    }
    .progress-wrap { margin-top: 10px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 0.74rem; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
    .progress-track { width: 100%; height: 8px; background: #1e293b; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #10b981); border-radius: 999px; transition: width 0.25s ease; }

    .tabs { display: flex; gap: 4px; background: #090e1a; padding: 4px; border-radius: 9px; border: 1px solid var(--card-border); }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.73rem; font-weight: 700; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: #fff; }

    .q-list { display: flex; flex-direction: column; gap: 10px; max-height: 440px; overflow-y: auto; padding-right: 4px; }
    .q-card { background: #090e1a; border: 1px solid var(--card-border); border-radius: 10px; padding: 11px; }
    .q-card.selected { border-color: var(--accent); }
    .q-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .q-badge { font-size: 0.69rem; font-weight: 800; padding: 2px 8px; border-radius: 5px; background: var(--accent-soft); color: #a5b4fc; }
    .q-actions { display: flex; gap: 4px; }
    .icon-btn { background: #1e293b; border: 1px solid #334155; color: var(--text-muted); border-radius: 5px; padding: 3px 6px; font-size: 0.7rem; cursor: pointer; }
    .icon-btn:hover { color: #fff; background: #334155; }
    .icon-btn.del:hover { color: #fca5a5; border-color: #ef4444; }
    .opt-row { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
    .opt-pick { width: 29px; height: 29px; border-radius: 7px; border: 1px solid #334155; background: #1e293b; color: var(--text-muted); font-weight: 800; font-size: 0.74rem; cursor: pointer; flex-shrink: 0; }
    .opt-pick.correct { background: rgba(16, 185, 129, 0.22); border-color: #10b981; color: #34d399; }

    /* Simulador 9:16 */
    .sim-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .phone-frame {
      width: 264px;
      height: 468px;
      border-radius: 22px;
      border: 3px solid #334155;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      padding: 15px 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    }
    .sim-header { width: 100%; padding: 6px 10px; border-radius: 8px; background: rgba(15, 23, 42, 0.75); display: flex; justify-content: space-between; font-size: 9px; font-weight: 900; color: #fff; }
    .sim-dots { width: 100%; display: grid; gap: 4px; margin-top: 8px; }
    .sim-dot { height: 4px; border-radius: 99px; background: rgba(255,255,255,0.28); }
    .sim-cat { margin-top: 11px; font-size: 9px; font-weight: 900; letter-spacing: 1.4px; }
    .sim-qbox { width: 100%; margin-top: 7px; padding: 11px 9px; border-radius: 10px; background: #fff; color: #0f172a; font-weight: 900; font-size: 12.5px; line-height: 1.24; text-align: center; min-height: 68px; display: flex; align-items: center; justify-content: center; }
    .sim-clock { margin-top: 11px; width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: #0f172a; }
    .sim-track { width: 94%; height: 5px; border-radius: 99px; background: rgba(255,255,255,0.25); margin-top: 9px; overflow: hidden; }
    .sim-fill { height: 100%; transition: width 0.25s linear; }
    .sim-opts { width: 100%; margin-top: 11px; display: flex; flex-direction: column; gap: 6px; }
    .sim-opt { width: 100%; padding: 6px 8px; border-radius: 8px; background: #fff; border: 2px solid #0f172a; display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 800; color: #0f172a; }
    .sim-opt-let { width: 19px; height: 19px; border-radius: 5px; background: #0f172a; color: #fff; font-size: 9.5px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sim-footer { margin-top: auto; font-size: 8.5px; font-weight: 900; letter-spacing: 1px; color: #fff; }

    .run-item { background: #111827; border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; }
    .run-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .badge-status { font-size: 0.65rem; font-weight: 800; padding: 2px 7px; border-radius: 5px; text-transform: uppercase; }
    .status-queued { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .status-in_progress { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
    .status-completed { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .status-failed { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .run-title { font-weight: 700; font-size: 0.84rem; margin-bottom: 2px; word-break: break-word; }
    .run-meta { font-size: 0.71rem; color: var(--text-muted); margin-bottom: 8px; }
    .pipeline-steps { display: flex; gap: 4px; margin-bottom: 9px; }
    .step-bar { flex: 1; height: 4px; border-radius: 2px; background: #1e293b; }
    .step-bar.done { background: var(--success); }
    .step-bar.active { background: #818cf8; animation: pulse 1.2s infinite; }
    .step-bar.fail { background: var(--danger); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .run-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .run-btn { font-size: 0.71rem; font-weight: 600; padding: 4px 8px; border-radius: 6px; text-decoration: none; background: #1e293b; color: var(--text); border: 1px solid #334155; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .run-btn:hover { background: #334155; }
    .run-btn.download { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: var(--success); }
    .empty-state { text-align: center; padding: 24px 10px; color: var(--text-muted); font-size: 0.82rem; }
    .spinner { width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const OWNER = 'evandromqs';
    const REPO = 'creator';
    const WORKFLOW_ID = 'render.yml';
    const EDGE_TTS_WORKER_URL = 'https://creator-tts.evandrodev.workers.dev/tts';
    const OUTRO_TEXT = 'Qual foi a mais difícil? Comente sua nota aqui embaixo e siga o canal para mais desafios!';
    const ttsCache = new Map();

    const TEMPLATES = [
      { id: 'quiz-mobile', icon: '❓', name: 'Quiz Mobile', desc: 'Timer + SFX' },
      { id: 'kinetic-shorts', icon: '⚡', name: 'Kinetic Shorts', desc: 'Tipografia Viral' },
      { id: 'story-loop', icon: '🔄', name: 'Story Loop', desc: 'Loop Infinito' },
      { id: 'tech-viral', icon: '💻', name: 'Tech Viral', desc: 'Mini-Doc Tech' },

    async function fetchEdgeTtsBytes(text, voice = 'pt-BR-FranciscaNeural', rate = '0.9') {
      const key = `${voice}|${rate}|${text}`;
      if (ttsCache.has(key)) return ttsCache.get(key);
      const url = `${EDGE_TTS_WORKER_URL}?text=${encodeURIComponent(text)}&rate=${encodeURIComponent(rate)}&voice=${encodeURIComponent(voice)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Erro TTS Worker (${res.status})`);
      const buf = await res.arrayBuffer();
      ttsCache.set(key, buf);
      return buf;
    }

    function trimAudioBufferSilence(ctx, buf, threshold = 0.008) {
      const data = buf.getChannelData(0);
      const pad = Math.floor(buf.sampleRate * 0.02);
      let start = 0;
      while (start < data.length && Math.abs(data[start]) <= threshold) start++;
      let end = data.length - 1;
      while (end > start && Math.abs(data[end]) <= threshold) end--;
      start = Math.max(0, start - pad);
      end = Math.min(data.length - 1, end + pad);
      const len = Math.max(1, end - start + 1);
      const out = ctx.createBuffer(buf.numberOfChannels, len, buf.sampleRate);
      for (let ch = 0; ch < buf.numberOfChannels; ch++) out.copyToChannel(buf.getChannelData(ch).subarray(start, end + 1), ch);
      return out;
    }

    function audioBufferToWavBlob(buffer) {
      const numChannels = buffer.numberOfChannels, sampleRate = buffer.sampleRate, length = buffer.length;
      const blockAlign = numChannels * 2, dataSize = length * blockAlign;
      const wavBuffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(wavBuffer);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true); view.setUint16(34, 16, true); writeStr(36, 'data'); view.setUint32(40, dataSize, true);
      const channels = Array.from({ length: numChannels }, (_, ch) => buffer.getChannelData(ch));
      let offset = 44;
      for (let i = 0; i < length; i++) {
        for (let ch = 0; ch < numChannels; ch++) {
          const s = Math.max(-1, Math.min(1, channels[ch][i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
          offset += 2;
        }
      }
      return new Blob([wavBuffer], { type: 'audio/wav' });
    }

    async function buildFullQuizAudioViaWorker(questions, voice, onProgress) {
      const textsSet = new Set([OUTRO_TEXT, '5', '4', '3', '2', '1', 'A:', 'B:', 'C:']);
      questions.forEach(item => {
        textsSet.add(item.q);
        (item.opts || []).slice(0, 3).forEach(opt => textsSet.add(`${opt}?`));
        textsSet.add(`Resposta certa: ${item.ans}!`);
      });
      const uniqueTexts = Array.from(textsSet);
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx({ sampleRate: 44100 });
      try {
        onProgress(8, `Preparando ${uniqueTexts.length} falas + SFX...`);
        const rawMap = new Map();
        let completed = 0;
        for (let i = 0; i < uniqueTexts.length; i += 6) {
          await Promise.all(uniqueTexts.slice(i, i + 6).map(async t => {
            const bytes = await fetchEdgeTtsBytes(t, voice, '0.9');
            rawMap.set(t, trimAudioBufferSilence(ctx, await ctx.decodeAudioData(bytes.slice(0))));
            completed++;
            onProgress(10 + Math.round((completed / uniqueTexts.length) * 65), `Sintetizando voz (${completed}/${uniqueTexts.length})...`);
          }));
        }
        onProgress(80, 'Carregando tic-tac.mp3 e trim_alarm.mp3...');
        const [tictacBuf, trimBuf] = await Promise.all([
          fetch('sfx/tic-tac.mp3').then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b)),
          fetch('sfx/trim_alarm.mp3').then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b)),
        ]);
        const events = [], roundsMeta = [];
        let cursor = 0;
        for (const item of questions) {
          const qBuf = rawMap.get(item.q);
          events.push({ buf: qBuf, at: cursor }); cursor += qBuf.duration + 0.35;
          for (let oi = 0; oi < 3; oi++) {
            const lBuf = rawMap.get(['A:', 'B:', 'C:'][oi]);
            events.push({ buf: lBuf, at: cursor }); cursor += lBuf.duration + 0.2;
            const oBuf = rawMap.get(`${(item.opts || [])[oi] || ''}?`);
            events.push({ buf: oBuf, at: cursor }); cursor += oBuf.duration + (oi < 2 ? 0.3 : 0.45);
          }
          const startCue = cursor;
          for (const n of ['5', '4', '3', '2', '1']) {
            const nBuf = rawMap.get(n);
            events.push({ buf: nBuf, at: cursor }); cursor += nBuf.duration + 0.7;
          }
          roundsMeta.push({ startCue, revealAt: cursor });
          const ansBuf = rawMap.get(`Resposta certa: ${item.ans}!`);
          events.push({ buf: ansBuf, at: cursor }); cursor += ansBuf.duration + 0.9;
        }
        const outroBuf = rawMap.get(OUTRO_TEXT);
        events.push({ buf: outroBuf, at: cursor }); cursor += outroBuf.duration;

        onProgress(92, 'Mixando pausas + tic-tac contínuo + trim_alarm...');
        const offline = new OfflineAudioContext(2, Math.ceil((cursor + 0.5) * 44100), 44100);
        for (const ev of events) {
          const src = offline.createBufferSource();
          src.buffer = ev.buf; src.connect(offline.destination); src.start(ev.at);
        }
        for (const rm of roundsMeta) {
          const ttSrc = offline.createBufferSource();
          ttSrc.buffer = tictacBuf; ttSrc.loop = true;
          const ttGain = offline.createGain();
          ttGain.gain.setValueAtTime(0.45, rm.startCue);
          ttGain.gain.setValueAtTime(0.45, Math.max(rm.startCue, rm.revealAt - 0.12));
          ttGain.gain.linearRampToValueAtTime(0.0001, rm.revealAt);
          ttSrc.connect(ttGain); ttGain.connect(offline.destination);
          ttSrc.start(rm.startCue); ttSrc.stop(rm.revealAt + 0.01);

          const alSrc = offline.createBufferSource();
          alSrc.buffer = trimBuf;
          const alGain = offline.createGain();
          alGain.gain.setValueAtTime(0.85, rm.revealAt);
          alSrc.connect(alGain); alGain.connect(offline.destination); alSrc.start(rm.revealAt);
        }
        const rendered = await offline.startRendering();
        onProgress(100, 'Áudio completo pronto!');
        return audioBufferToWavBlob(rendered);
      } finally { ctx.close().catch(() => {}); }
    }

    async function buildProseNarrationViaWorker(fullText, voice, rate, onProgress) {
      const sentences = String(fullText || '').split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);
      if (!sentences.length) throw new Error('Texto da narração vazio.');
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx({ sampleRate: 44100 });
      try {
        onProgress(10, `Sintetizando ${sentences.length} trecho(s)...`);
        const buffers = new Array(sentences.length);
        let done = 0;
        await Promise.all(sentences.map(async (sent, idx) => {
          const bytes = await fetchEdgeTtsBytes(sent, voice, rate);
          buffers[idx] = trimAudioBufferSilence(ctx, await ctx.decodeAudioData(bytes.slice(0)));
          done++;
          onProgress(15 + Math.round((done / sentences.length) * 70), `Sintetizando trecho ${done}/${sentences.length}...`);
        }));
        onProgress(90, 'Finalizando narração...');
        let cursor = 0;
        const events = buffers.map(b => { const ev = { buf: b, at: cursor }; cursor += b.duration + 0.22; return ev; });
        const offline = new OfflineAudioContext(2, Math.ceil((cursor + 0.4) * 44100), 44100);
        for (const ev of events) {
          const src = offline.createBufferSource();
          src.buffer = ev.buf; src.connect(offline.destination); src.start(ev.at);
        }
        const rendered = await offline.startRendering();
        onProgress(100, 'Narração pronta!');
        return audioBufferToWavBlob(rendered);
      } finally { ctx.close().catch(() => {}); }
    }

    async function extractFirstFileFromZip(arrayBuffer, mimeType = 'application/octet-stream') {
      const bytes = new Uint8Array(arrayBuffer), view = new DataView(arrayBuffer);
      let eocdOffset = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
        if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) { eocdOffset = i; break; }
      }
      if (eocdOffset === -1) throw new Error('ZIP inválido.');
      const cdOffset = view.getUint32(eocdOffset + 16, true);
      const compressionMethod = view.getUint16(cdOffset + 10, true);
      const compressedSize = view.getUint32(cdOffset + 20, true);
      const localHeaderOffset = view.getUint32(cdOffset + 42, true);
      const fileNameLen = view.getUint16(localHeaderOffset + 26, true);
      const extraLen = view.getUint16(localHeaderOffset + 28, true);
      const slice = arrayBuffer.slice(localHeaderOffset + 30 + fileNameLen + extraLen, localHeaderOffset + 30 + fileNameLen + extraLen + compressedSize);
      if (compressionMethod === 0) return new Blob([slice], { type: mimeType });
      if (compressionMethod === 8) {
        const stream = new Blob([slice]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return new Blob([await new Response(stream).blob()], { type: mimeType });
      }
      throw new Error(`Compressão não suportada: ${compressionMethod}`);
    }

    async function ghApi(token, endpoint, options = {}) {
      if (!token) throw new Error('Insira seu GitHub Token.');
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/${endpoint}`, {
        ...options,
        headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', ...(options.headers || {}) },
      });
      if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        throw new Error(errorData.message || `Erro HTTP ${res.status}`);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    async function dispatchRender(token, { template, title, customData, theme = 'roxo', mode = 'full' }) {
      try {
        return await ghApi(token, `actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: 'POST',
          body: JSON.stringify({ ref: 'main', inputs: { template, video_title: title, custom_data: customData, theme, mode } }),
        });
      } catch (err) {
        if (String(err.message).includes('Unexpected inputs')) {
          return ghApi(token, `actions/workflows/${WORKFLOW_ID}/dispatches`, {
            method: 'POST',
            body: JSON.stringify({ ref: 'main', inputs: { template, video_title: title, custom_data: customData } }),
          });
        }
        throw err;
      }
    }

    async function callGroq(groqKey, model, systemPrompt, userPrompt) {
      if (!groqKey) throw new Error('Configure sua Groq API Key na seção Integrações.');
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { Authorization: `Bearer ${groqKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, temperature: 0.75, messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }] }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `Erro Groq HTTP ${res.status}`);
      }
      const data = await res.json();
      return data.choices[0].message.content.trim().replace(/^```(?:json)?\s*/i, '').replace(/```$/i, '').trim();
    }

                const isCorrect = opt === item.ans;

                return (
                  <div key={oi} className="sim-opt" style={style}>
                    <span className="sim-opt-let">{['A', 'B', 'C'][oi]}</span>
                    <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{opt}</span>
                    {revealed && isCorrect && <span>✓</span>}
                  </div>
                );
              })}
            </div>

          </div>

          </div>
        </div>
      );
    }

      // Batch state

      const [batchTemplate, setBatchTemplate] = useState('quiz-mobile');

      // Runs & Kanban

      function notify(type, title, msg = '') {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, type, title, msg }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4500);
      }

      function persistScript(entry) {
        setSavedScripts(prev => {
          const next = [entry, ...prev].slice(0, 40);
          localStorage.setItem('creator_saved_scripts', JSON.stringify(next));
          return next;
        });
      }

        setTemplate(tplId);
        setAiTopic(QUICK_SUGGESTIONS[tplId][0]);

        setVideoTitle(`${tplId.split('-')[0]}-${Math.floor(Math.random() * 900 + 100)}`);
      }

      function syncKineticScenes(nextList) {
        setKineticScenes(nextList);
        setKineticJson(JSON.stringify(nextList, null, 2));
        setKineticJsonErr('');
        if (activeKineticIdx >= nextList.length) setActiveKineticIdx(Math.max(0, nextList.length - 1));
      }

      function handleKineticJsonChange(val) {
        setKineticJson(val);
        try {
          const parsed = JSON.parse(val);
          const arr = Array.isArray(parsed) ? parsed : parsed.scenes;
          if (!Array.isArray(arr) || !arr.length) throw new Error('Informe ao menos 1 cena.');
          setKineticScenes(arr);
          setKineticJsonErr('');
        } catch (err) { setKineticJsonErr(err.message); }
      }

      function syncQuestions(nextList) {
        setQuestions(nextList);
        setJsonText(JSON.stringify(nextList, null, 2));
        setJsonError('');
        if (activeIdx >= nextList.length) setActiveIdx(Math.max(0, nextList.length - 1));
      }

      function handleJsonChange(val) {
        setJsonText(val);
        try {
          const parsed = JSON.parse(val);
          const arr = Array.isArray(parsed) ? parsed : parsed.questions;
          if (!Array.isArray(arr) || !arr.length) throw new Error('Informe ao menos 1 pergunta.');
          setQuestions(arr);
          setJsonError('');
        } catch (err) { setJsonError(err.message); }
      }

      async function fetchRuns(overrideToken) {
        const tk = overrideToken !== undefined ? overrideToken : ghToken;
        if (!tk) return;
        try {
          const data = await ghApi(tk, `actions/workflows/${WORKFLOW_ID}/runs?per_page=18`);
          setRuns(data.workflow_runs || []);
          setRunsError('');
        } catch (err) { setRunsError(err.message); }
      }

      useEffect(() => {
        if (!ghToken) return;
        fetchRuns(ghToken);
        const id = setInterval(() => fetchRuns(ghToken), 15000);
        return () => clearInterval(id);
      }, [ghToken]);

      const kpis = useMemo(() => {
        const queued = runs.filter(r => r.status === 'queued').length;
        const active = runs.filter(r => r.status === 'in_progress').length;
        const success = runs.filter(r => r.status === 'completed' && r.conclusion === 'success').length;
        const fail = runs.filter(r => r.status === 'completed' && r.conclusion !== 'success').length;
        const finished = success + fail;
        const rate = finished ? Math.round((success / finished) * 100) : 100;
        return { total: runs.length, queued, active, success, fail, inFlight: queued + active, rate };
      }, [runs]);

      function setAudioUrlAndPlay(url, statusMsg) {
        setAudioSrc(url);
        setAudioStatus(statusMsg);
        setTimeout(() => { if (audioRef.current) { audioRef.current.load(); audioRef.current.play().catch(() => {}); } }, 60);
      }

      function setAudioBlob(blob, statusMsg) {
        if (audioObjUrlRef.current) URL.revokeObjectURL(audioObjUrlRef.current);
        const objUrl = URL.createObjectURL(blob);
        audioObjUrlRef.current = objUrl;
        setAudioUrlAndPlay(objUrl, statusMsg);
      }

      async function generateByTemplate(tplId, topic, tone, count) {
        const key = groqKey || groqDraft.trim();
        if (tplId === 'quiz-mobile') {
          const raw = await callGroq(
            key, groqModel,
            'Retorne APENAS um JSON válido no formato {"questions":[{"q":"pergunta curta","opts":["op1","op2","op3"],"ans":"op_correta"}]} sem markdown. Cada pergunta deve ter EXATAMENTE 3 opções em opts.',
            `Gere ${count} perguntas de quiz sobre "${topic}" (nível ${tone}) em português do Brasil, curtas e envolventes.`
          );
          const parsed = JSON.parse(raw);
          const list = (Array.isArray(parsed) ? parsed : parsed.questions).map(i => ({
            q: String(i.q || ''), opts: Array.isArray(i.opts) ? i.opts.slice(0, 3) : ['A', 'B', 'C'], ans: String(i.ans || i.opts?.[0] || ''), category: i.category || topic.toUpperCase(),
          }));
          return { title: `quiz-${slugify(topic)}-${Math.floor(Math.random() * 900 + 100)}`, payload: list };
        }
        if (tplId === 'story-loop') {
          const raw = await callGroq(
            key, groqModel,
            'Retorne APENAS um JSON válido no formato {"title":"Título curto","loopHook":"frase gancho","scenes":[{"id":"scene-1","eyebrow":"Capítulo 1","title":"Título 1","text":"Frase curta 1","start":0,"end":6},{"id":"scene-2","eyebrow":"Capítulo 2","title":"Título 2","text":"Frase curta 2","start":6,"end":13},{"id":"scene-3","eyebrow":"Capítulo 3","title":"Título 3","text":"Frase curta 3 conectando ao início","start":13,"end":20}]} sem markdown.',
            `Crie uma história curta em loop infinito sobre "${topic}" com tom "${tone}" em português do Brasil.`
          );
          return { title: `story-${slugify(topic)}-${Math.floor(Math.random() * 900 + 100)}`, payload: JSON.parse(raw) };
        }
        if (tplId === 'commercial-ad') {
          const raw = await callGroq(
            key, groqModel,
            'Retorne APENAS um JSON válido no formato {"tag":"TAG CURTA","headline":"2 PALAVRAS","highlight":"DESTAQUE","headlineEnd":"FIM","sub":"Subtítulo curto","cards":["✓ Benefício 1","✓ Benefício 2","✓ Benefício 3"],"ctaTitle":"COMECE","ctaHighlight":"AGORA","ctaButton":"TEXTO BOTÃO","narrationText":"Texto completo de locução comercial de 18 segundos"} sem markdown.',
            `Crie um anúncio comercial de alta conversão para "${topic}" com tom "${tone}".`
          );
          return { title: `ad-${slugify(topic)}-${Math.floor(Math.random() * 900 + 100)}`, payload: JSON.parse(raw) };
        }
        if (tplId === 'kinetic-shorts') {
          const sceneNum = Math.min(12, Math.max(10, Number(count) || 10));
          const raw = await callGroq(
            key, groqModel,
            'Retorne APENAS um JSON válido no formato {"title":"Título","scenes":[{"id":"c1","layout":"impact|timeline|stat|quote|stamp|mystery|split_vs|cta","accent":"gold|crimson|cyan|emerald|violet","eyebrow":"TEXTO CURTO","headline":"MANCHETE CURTA","subheadline":"SUBTÍTULO CURTO","statNumber":1000,"statLabel":"UNIDADE","badge":"SELO","vsLeft":"LADO A","vsRight":"LADO B","narration":"Frase narrada natural de 1 a 2 sentenças."}]} sem markdown. Varie os layouts entre as cenas e termine a última cena obrigatoriamente com layout "cta".',
            `Crie um mini-documentário vertical dinâmico de EXATAMENTE ${sceneNum} cenas sobre "${topic}" com tom "${tone}" em português do Brasil.`
          );
          const parsed = JSON.parse(raw);
          const list = Array.isArray(parsed) ? parsed : parsed.scenes || [];
          const normalized = list.map((s, idx) => ({
            id: s.id || `c${idx + 1}`,
            layout: s.layout || 'impact',
            accent: KINETIC_ACCENTS[s.accent] ? s.accent : 'gold',
            eyebrow: String(s.eyebrow || `PARTE ${idx + 1}`),
            headline: String(s.headline || ''),
            subheadline: String(s.subheadline || ''),
            statNumber: s.statNumber,
            statLabel: s.statLabel,
            badge: s.badge,
            vsLeft: s.vsLeft,
            vsRight: s.vsRight,
            narration: String(s.narration || s.text || ''),
          }));
          return {
            title: `doc-${slugify(topic)}-${Math.floor(Math.random() * 900 + 100)}`,
            payload: { title: parsed.title || topic, voice: voiceName, scenes: normalized },
          };
        }
        const raw = await callGroq(
          key, groqModel,
          'Você é um roteirista viral para Shorts/Reels. Retorne APENAS o texto puro da narração, sem títulos nem marcações.',
          `Escreva um roteiro narrado (110 a 140 palavras) sobre "${topic}" com tom "${tone}". Gancho forte no início e CTA no final.`
        );
        return { title: `${tplId.split('-')[0]}-${slugify(topic)}-${Math.floor(Math.random() * 900 + 100)}`, payload: raw.replace(/^["']|["']$/g, '').trim() };
      }

      async function handleGenerateAi() {
        const topic = aiTopic.split(',')[0].trim() || 'Curiosidades';
        setAiLoading(true);
        try {
          const itemCount = template === 'quiz-mobile' ? (Number(quizCount) || 6) : (Number(kineticCount) || 10);
          const res = await generateByTemplate(template, topic, aiTone, itemCount);
          setVideoTitle(res.title);
          if (template === 'quiz-mobile') {
            syncQuestions(res.payload);
            setActiveIdx(0); setSimRevealed(false); setSimClock(5);
          } else if (template === 'kinetic-shorts') {
            syncKineticScenes(res.payload.scenes || []);
            setActiveKineticIdx(0);
          } else if (template === 'story-loop') setStoryData(res.payload);
          else if (template === 'commercial-ad') setAdData(res.payload);
          else setScriptText(res.payload);

          persistScript({ id: Date.now(), template, title: res.title, topic, payload: res.payload, createdAt: new Date().toISOString() });
          notify('success', 'Roteiro gerado com Groq IA!', `Salvo no histórico como "${res.title}".`);
        } catch (err) {
          notify('error', 'Erro ao gerar com IA', err.message);
        } finally { setAiLoading(false); }
      }

      async function handleBatchRun() {
        if (!ghToken) { setActiveSection('settings'); return notify('warning', 'GitHub Token necessário', 'Configure seu token em Integrações.'); }
        const topics = batchTopicsText.split(/\r?\n|,/).map(t => t.trim()).filter(Boolean);
        if (!topics.length) return notify('warning', 'Lista vazia', 'Informe ao menos 1 tema.');
        setBatchRunning(true);
        setBatchProgress({ cur: 0, total: topics.length, label: 'Iniciando lote...' });
        try {
          for (let i = 0; i < topics.length; i++) {
            const tp = topics[i];
            setBatchProgress({ cur: i + 1, total: topics.length, label: `Gerando "${tp}" (${i + 1}/${topics.length})...` });
            const batchItemCount = batchTemplate === 'kinetic-shorts' ? Math.min(12, Math.max(10, Number(batchCount) || 10)) : (Number(batchCount) || 6);
            const res = await generateByTemplate(batchTemplate, tp, batchTemplate === 'quiz-mobile' ? 'Médio' : 'Dinâmico & Curioso', batchItemCount);
            persistScript({ id: Date.now() + i, template: batchTemplate, title: res.title, topic: tp, payload: res.payload, createdAt: new Date().toISOString() });
            const customData = typeof res.payload === 'string' ? res.payload : JSON.stringify(res.payload);
            await dispatchRender(ghToken, { template: batchTemplate, title: res.title, customData, theme: batchTheme, mode: 'full' });
          }

          setActiveSection('kanban');

          notify('error', 'Falha no lote', err.message);
        } finally { setBatchRunning(false); }

      async function handleGenerateAudio() {
        if (template === 'quiz-mobile' && jsonError) return notify('error', 'JSON inválido', 'Corrija antes de gerar áudio.');
        setAudioLoading(true);
        setAudioProgress(5);
        if (template === 'quiz-mobile' && isLocal) {
          setAudioStatus('Sintetizando Francisca + tic-tac localmente...');
          const timer = setInterval(() => setAudioProgress(p => (p < 88 ? p + 4 : p)), 450);
          try {
            const res = await fetch('/api/preview-audio', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ questions, theme: visualTheme, category: aiTopic.split(',')[0].trim() }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `Erro HTTP ${res.status}`);
            setAudioProgress(100);
            setAudioUrlAndPlay(data.audioUrl, '✅ Áudio oficial pronto!');
            if (data.videoPreviewUrl) setLocalVideoUrl(data.videoPreviewUrl);
          } catch (err) {
            setAudioProgress(0); notify('error', 'Erro no áudio local', err.message);
          } finally { clearInterval(timer); setAudioLoading(false); }
          return;
        }
        try {
          if (template === 'quiz-mobile') {
            const blob = await buildFullQuizAudioViaWorker(questions, voiceName, (pct, msg) => { setAudioProgress(pct); setAudioStatus(msg); });
            setAudioBlob(blob, '✅ Áudio completo (Francisca 0.9x + tic-tac + trim_alarm) pronto!');
          } else {
            const textToSpeak = template === 'kinetic-shorts'
              ? kineticScenes.map(s => s.narration).filter(Boolean).join(' ')
              : template === 'story-loop'
                ? (storyData.scenes || []).map(s => s.text).join(' ')
                : template === 'commercial-ad'
                  ? adData.narrationText
                  : scriptText;
            const rate = voiceName === 'pt-BR-FranciscaNeural' ? '0.9' : '0.95';
            const blob = await buildProseNarrationViaWorker(textToSpeak, voiceName, rate, (pct, msg) => { setAudioProgress(pct); setAudioStatus(msg); });
            setAudioBlob(blob, '✅ Narração pronta!');
          }
          notify('success', 'Áudio gerado!', 'Ouça no player abaixo.');
        } catch (err) {
          setAudioProgress(0); setAudioStatus(`❌ ${err.message}`); notify('error', 'Erro ao gerar áudio', err.message);
        } finally { setAudioLoading(false); }
      }

      function playMp3Bytes(bytes) {
        return new Promise((resolve) => {
          if (instantAbortRef.current) return resolve();
          const url = URL.createObjectURL(new Blob([bytes.slice(0)], { type: 'audio/mpeg' }));
          const audio = new Audio(url);
          activeSpeechAudioRef.current = audio;
          const cleanup = () => { if (activeSpeechAudioRef.current === audio) activeSpeechAudioRef.current = null; URL.revokeObjectURL(url); resolve(); };
          audio.onended = cleanup; audio.onerror = cleanup; audio.play().catch(cleanup);
        });
      }

      async function speakEdge(text) {
        if (instantAbortRef.current) return;
        const bytes = await fetchEdgeTtsBytes(text, voiceName, '0.9');
        if (!instantAbortRef.current) await playMp3Bytes(bytes);
      }

      async function handleInstantPreview() {
        if (template === 'kinetic-shorts') {
          if (!kineticScenes.length) return notify('warning', 'Sem cenas', 'Adicione ao menos 1 cena.');
          instantAbortRef.current = false;
          setInstantPlaying(true);
          const rate = voiceName === 'pt-BR-FranciscaNeural' ? '0.9' : '0.95';
          try {
            for (let i = 0; i < kineticScenes.length && !instantAbortRef.current; i++) {
              const sc = kineticScenes[i];
              setActiveKineticIdx(i);
              setAudioStatus(`⚡ Cena ${i + 1}/${kineticScenes.length}: ${sc.headline || sc.eyebrow}...`);
              if (i + 1 < kineticScenes.length) {
                fetchEdgeTtsBytes(kineticScenes[i + 1].narration, voiceName, rate).catch(() => {});
              }
              const bytes = await fetchEdgeTtsBytes(sc.narration || sc.headline, voiceName, rate);
              if (instantAbortRef.current) break;
              await playMp3Bytes(bytes);
              if (instantAbortRef.current) break;
              await sleepMs(220);
            }
            if (!instantAbortRef.current) setAudioStatus('✅ Prévia do documentário concluída!');
          } finally {
            if (activeSpeechAudioRef.current) { activeSpeechAudioRef.current.pause(); activeSpeechAudioRef.current = null; }
            setInstantPlaying(false);
          }
          return;
        }
        if (!questions.length) return notify('warning', 'Sem perguntas', 'Adicione ao menos 1 rodada.');
        instantAbortRef.current = false;
        setInstantPlaying(true);
        const playOneSfx = (path) => { if (!instantAbortRef.current) { const a = new Audio(path); a.volume = 0.85; a.play().catch(() => {}); } };
        try {
          Promise.all(['5', '4', '3', '2', '1', 'A:', 'B:', 'C:'].map(t => fetchEdgeTtsBytes(t, voiceName, '0.9'))).catch(() => {});
          for (let i = 0; i < questions.length && !instantAbortRef.current; i++) {
            const q = questions[i];
            setActiveIdx(i); setSimRevealed(false); setSimClock(5);
            setAudioStatus(`⚡ Carregando fala (Rodada ${i + 1}/${questions.length})...`);
            await Promise.all([q.q, `${q.opts?.[0] || ''}?`, `${q.opts?.[1] || ''}?`, `${q.opts?.[2] || ''}?`, `Resposta certa: ${q.ans}!`].map(t => fetchEdgeTtsBytes(t, voiceName, '0.9').catch(() => null)));
            if (instantAbortRef.current) break;
            setAudioStatus(`⚡ Rodada ${i + 1}/${questions.length}: Pergunta...`);
            await speakEdge(q.q); if (instantAbortRef.current) break; await sleepMs(350);
            for (let oi = 0; oi < 3 && !instantAbortRef.current; oi++) {
              await speakEdge(['A:', 'B:', 'C:'][oi]); if (instantAbortRef.current) break; await sleepMs(200);
              await speakEdge(`${(q.opts || [])[oi] || ''}?`); if (instantAbortRef.current) break; await sleepMs(oi < 2 ? 300 : 450);
            }
            if (activeTicTacRef.current) { activeTicTacRef.current.pause(); activeTicTacRef.current = null; }
            const tictac = new Audio('sfx/tic-tac.mp3'); tictac.loop = true; tictac.volume = 0.45; tictac.play().catch(() => {}); activeTicTacRef.current = tictac;
            for (const n of [5, 4, 3, 2, 1]) {
              if (instantAbortRef.current) break;
              setSimClock(n); setAudioStatus(`⚡ Rodada ${i + 1}/${questions.length}: Contagem ${n}...`);
              await speakEdge(String(n)); if (instantAbortRef.current) break; await sleepMs(700);
            }
            if (activeTicTacRef.current) { activeTicTacRef.current.pause(); activeTicTacRef.current = null; }
            if (instantAbortRef.current) break;
            setSimClock(0); setSimRevealed(true); setAudioStatus(`⚡ Rodada ${i + 1}/${questions.length}: Resposta!`);
            playOneSfx('sfx/trim_alarm.mp3');
            await speakEdge(`Resposta certa: ${q.ans}!`); if (instantAbortRef.current) break; await sleepMs(900);
          }
          if (!instantAbortRef.current) setAudioStatus('✅ Prévia ao vivo concluída!');
        } finally {
          if (activeSpeechAudioRef.current) { activeSpeechAudioRef.current.pause(); activeSpeechAudioRef.current = null; }
          if (activeTicTacRef.current) { activeTicTacRef.current.pause(); activeTicTacRef.current = null; }
          setInstantPlaying(false);
        }
      }

      function stopInstantPreview() {
        instantAbortRef.current = true;
        if (activeSpeechAudioRef.current) { activeSpeechAudioRef.current.pause(); activeSpeechAudioRef.current = null; }
        if (activeTicTacRef.current) { activeTicTacRef.current.pause(); activeTicTacRef.current = null; }
        setInstantPlaying(false); setAudioStatus('⏹ Prévia interrompida.');
      }

      async function handleDispatchRender() {
        if (!ghToken) { setActiveSection('settings'); return notify('warning', 'GitHub Token necessário', 'Salve seu token na seção Integrações.'); }
        if (template === 'quiz-mobile' && jsonError) return notify('error', 'JSON inválido', 'Corrija o roteiro antes de enviar.');
        if (template === 'kinetic-shorts' && kineticJsonErr) return notify('error', 'JSON inválido', 'Corrija o JSON das cenas antes de enviar.');
        const title = videoTitle.trim() || template;
        let customData = '';
        if (template === 'quiz-mobile') customData = JSON.stringify(questions);
        else if (template === 'kinetic-shorts') customData = JSON.stringify({ title, voice: voiceName, scenes: kineticScenes });
        else if (template === 'story-loop') customData = JSON.stringify(storyData);
        else if (template === 'commercial-ad') customData = JSON.stringify(adData);
        else customData = scriptText.trim();

        setDispatchLoading(true);
        try {
          await dispatchRender(ghToken, { template, title, customData, theme: visualTheme, mode: 'full' });
          notify('success', 'Enviado para a esteira!', `"${title}" já está na fila de renderização.`);
          setTimeout(() => fetchRuns(), 2200);
        } catch (err) {
          notify('error', 'Erro no disparo', err.message);
        } finally { setDispatchLoading(false); }
      }

      async function handlePlayRunAudio(runId) {
        try {
          const data = await ghApi(ghToken, `actions/runs/${runId}/artifacts`);
          const audioArt = (data.artifacts || []).find(a => a.name.endsWith('-audio'));
          if (!audioArt) throw new Error('Artefato de áudio (-audio) não encontrado.');
          const res = await fetch(audioArt.archive_download_url, { headers: { Authorization: `Bearer ${ghToken}` } });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const mp3Blob = await extractFirstFileFromZip(await res.arrayBuffer(), 'audio/mpeg');
          setAudioBlob(mp3Blob, `🔊 Reproduzindo: ${audioArt.name}`);
        } catch (err) { notify('error', 'Erro ao reproduzir MP3', err.message); }
      }

      async function handleDownloadRun(runId) {
        try {
          const data = await ghApi(ghToken, `actions/runs/${runId}/artifacts`);
          const artifacts = data.artifacts || [];
          const artifact = artifacts.find(a => !a.name.endsWith('-audio')) || artifacts[0];
          if (!artifact) throw new Error('Artefato não encontrado ou expirado.');
          const res = await fetch(artifact.archive_download_url, { headers: { Authorization: `Bearer ${ghToken}` } });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `${artifact.name || 'video'}.zip`;
          document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
          notify('success', 'Download iniciado!', `${artifact.name}.zip`);
        } catch (err) { notify('error', 'Erro no download', err.message); }
      }

      function updateKineticScene(idx, patch) {
        syncKineticScenes(kineticScenes.map((s, i) => (i === idx ? { ...s, ...patch } : s)));
      }
      function moveKineticScene(idx, delta) {
        const target = idx + delta;
        if (target < 0 || target >= kineticScenes.length) return;
        const copy = [...kineticScenes];
        const [item] = copy.splice(idx, 1);
        copy.splice(target, 0, item);
        syncKineticScenes(copy);
        setActiveKineticIdx(target);
      }
      function deleteKineticScene(idx) {
        if (kineticScenes.length <= 1) return notify('warning', 'Mínimo 1 cena', 'O documentário precisa de ao menos 1 cena.');
        syncKineticScenes(kineticScenes.filter((_, i) => i !== idx));
      }
      function addKineticScene() {
        const next = [
          ...kineticScenes,
          { id: `c${kineticScenes.length + 1}`, layout: 'impact', accent: 'cyan', eyebrow: 'NOVO FATO', headline: 'MANCHETE', subheadline: 'DETALHE VISUAL', narration: 'Texto da narração desta cena.' },

        setActiveKineticIdx(next.length - 1);

      function updateQuestion(idx, patch) { syncQuestions(questions.map((item, i) => (i === idx ? { ...item, ...patch } : item))); }
      function updateOption(qIdx, optIdx, newText) {
        const q = questions[qIdx];
        const newOpts = q.opts.map((o, i) => (i === optIdx ? newText : o));
        updateQuestion(qIdx, { opts: newOpts, ans: q.ans === q.opts[optIdx] ? newText : q.ans });
      }
      function moveQuestion(idx, delta) {
        const target = idx + delta;
        if (target < 0 || target >= questions.length) return;
        const copy = [...questions];
        const [item] = copy.splice(idx, 1);
        copy.splice(target, 0, item);
        syncQuestions(copy); setActiveIdx(target);
      }
      function duplicateQuestion(idx) {
        const copy = [...questions];
        copy.splice(idx + 1, 0, { ...questions[idx], opts: [...questions[idx].opts] });

      }
      function deleteQuestion(idx) {
        if (questions.length <= 1) return notify('warning', 'Mínimo 1 rodada', 'O quiz precisa ter ao menos uma pergunta.');
        syncQuestions(questions.filter((_, i) => i !== idx));

      function shuffleOptions(idx) {
        const opts = [...questions[idx].opts];
        for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
        updateQuestion(idx, { opts });
      }

                      <div className={template === 'quiz-mobile' || template === 'kinetic-shorts' ? 'row-3' : 'row-2'} style={{ marginBottom: '10px' }}>

                        <div style={{ minWidth: '230px', flex: '0 1 250px' }}>
                          <select value={groqModel} onChange={e => setGroqModel(e.target.value)}>
                            <option value="openai/gpt-oss-120b">openai/gpt-oss-120b (Qualidade)</option>
                            <option value="openai/gpt-oss-20b">openai/gpt-oss-20b (Rápido)</option>
                          </select>
                        </div>
                        <button className="btn-ai" type="button" onClick={handleGenerateAi} disabled={aiLoading}>{aiLoading ? '⏳ Gerando...' : '✨ Gerar Roteiro com IA'}</button>

                          const payload = template === 'quiz-mobile'
                            ? questions
                            : template === 'kinetic-shorts'
                              ? { title: videoTitle, voice: voiceName, scenes: kineticScenes }
                              : template === 'story-loop'
                                ? storyData
                                : template === 'commercial-ad'
                                  ? adData
                                  : scriptText;
                          persistScript({ id: Date.now(), template, title: videoTitle, topic: aiTopic, payload, createdAt: new Date().toISOString() });
                          notify('success', 'Rascunho salvo!', 'Disponível em Roteiros Salvos.');
                        }}>💾 Salvar</button>
                      </div>
                    </div>

                    <div className="card">
                      <div className="step-header">
                        <div className="step-title"><span className="step-num">3</span><span>Roteiro, Áudio & Disparo</span></div>

                          <div style={{ display: 'flex', gap: '6px' }}>
                            <div className="tabs">
                              <button type="button" className={`tab-btn ${editorTab === 'visual' ? 'active' : ''}`} onClick={() => setEditorTab('visual')}>✨ Cards ({questions.length})</button>
                              <button type="button" className={`tab-btn ${editorTab === 'json' ? 'active' : ''}`} onClick={() => setEditorTab('json')}>💻 JSON</button>
                            </div>
                            {editorTab === 'visual' && <button className="btn-secondary" type="button" onClick={addQuestion} style={{ padding: '4px 9px' }}>+ Pergunta</button>}
                          </div>
                        )}
                        {template === 'kinetic-shorts' && (
                          <div style={{ display: 'flex', gap: '6px' }}>
                            <div className="tabs">
                              <button type="button" className={`tab-btn ${kineticTab === 'visual' ? 'active' : ''}`} onClick={() => setKineticTab('visual')}>✨ Cenas ({kineticScenes.length})</button>
                              <button type="button" className={`tab-btn ${kineticTab === 'json' ? 'active' : ''}`} onClick={() => setKineticTab('json')}>💻 JSON</button>
                            </div>
                            {kineticTab === 'visual' && <button className="btn-secondary" type="button" onClick={addKineticScene} style={{ padding: '4px 9px' }}>+ Cena</button>}
                          </div>
                        )}
                      </div>

                      {template === 'quiz-mobile' ? (
                        editorTab === 'visual' ? (
                          <div className="q-list">
                            {questions.map((item, qIdx) => (
                              <div key={qIdx} className={`q-card ${activeIdx === qIdx ? 'selected' : ''}`} onClick={() => setActiveIdx(qIdx)}>
                                <div className="q-card-top">
                                  <span className="q-badge">Rodada {qIdx + 1}</span>
                                  <div className="q-actions" onClick={e => e.stopPropagation()}>
                                    <button type="button" className="icon-btn" onClick={() => moveQuestion(qIdx, -1)}>↑</button>
                                    <button type="button" className="icon-btn" onClick={() => moveQuestion(qIdx, 1)}>↓</button>
                                    <button type="button" className="icon-btn" onClick={() => shuffleOptions(qIdx)}>🔀</button>
                                    <button type="button" className="icon-btn" onClick={() => duplicateQuestion(qIdx)}>📄</button>
                                    <button type="button" className="icon-btn del" onClick={() => deleteQuestion(qIdx)}>🗑️</button>
                                  </div>
                                </div>
                                <div className="row-2" style={{ marginBottom: '6px' }}>
                                  <input type="text" value={item.q} onChange={e => updateQuestion(qIdx, { q: e.target.value })} style={{ fontWeight: 600 }} />
                                  <input type="text" value={item.category || ''} onChange={e => updateQuestion(qIdx, { category: e.target.value })} placeholder="Categoria" />
                                </div>
                                {(item.opts || []).slice(0, 3).map((opt, oi) => (
                                  <div key={oi} className="opt-row">
                                    <button type="button" className={`opt-pick ${opt === item.ans ? 'correct' : ''}`} onClick={() => updateQuestion(qIdx, { ans: opt })}>{['A', 'B', 'C'][oi]}</button>
                                    <input type="text" value={opt} onChange={e => updateOption(qIdx, oi, e.target.value)} />
                                  </div>
                                ))}
                              </div>
                            ))}
                          </div>
                        ) : (
                          <>
                            <textarea value={jsonText} onChange={e => handleJsonChange(e.target.value)} spellCheck="false" />
                            {jsonError && <div style={{ color: 'var(--danger)', fontSize: '0.75rem', marginTop: '4px' }}>⚠️ {jsonError}</div>}
                          </>
                        )
                      ) : template === 'kinetic-shorts' ? (
