<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Studio — Esteira de Produção (React)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --card-border: #1f2937;
      --accent: #6366f1;
      --accent-light: rgba(99, 102, 241, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--card-border);
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.4px;
    }
    .brand-badge {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-pill {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: #0b0f19;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.2s;
    }
    .status-pill.ok { border-color: rgba(16, 185, 129, 0.45); color: #34d399; }
    .status-pill.warn { border-color: rgba(245, 158, 11, 0.45); color: #fbbf24; }
    .status-pill:hover { border-color: var(--accent); }

    .repo-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .repo-link:hover { color: var(--text); }

    .container {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      padding: 22px 18px 40px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }
    @media (max-width: 820px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 15px 18px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .kpi-label {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-value { font-size: 1.75rem; font-weight: 800; }
    .kpi-value.accent { color: #818cf8; }
    .kpi-value.warning { color: var(--warning); }
    .kpi-value.success { color: var(--success); }
    .kpi-value.danger { color: var(--danger); }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 430px;
      gap: 22px;
      align-items: start;
    }
    @media (max-width: 1040px) { .main-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }
    .token-box {
      background: rgba(99, 102, 241, 0.05);
      border: 1px solid rgba(99, 102, 241, 0.25);
    }

    .card-title {
      font-size: 1.04rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      background: #0b0f19;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    textarea {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      min-height: 220px;
      resize: vertical;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 620px) { .row-2 { grid-template-columns: 1fr; } }

    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
    }
    .tpl-btn {
      background: #0b0f19;
      border: 2px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      color: var(--text);
    }
    .tpl-btn:hover { border-color: #4b5563; transform: translateY(-1px); }
    .tpl-btn.active { border-color: var(--accent); background: var(--accent-light); }
    .tpl-btn .icon { font-size: 1.25rem; display: block; margin-bottom: 4px; }
    .tpl-btn .name { font-size: 0.76rem; font-weight: 700; }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover { opacity: 0.95; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      background: #1f2937;
      color: var(--text);
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn-secondary:hover { background: #374151; }
    .btn-secondary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-ai {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-ai:hover { opacity: 0.92; }
    .btn-ai:disabled { opacity: 0.6; cursor: not-allowed; }

    .ai-box {
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      background: #0b0f19;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 7px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* Editor Visual de Perguntas */
    .q-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 540px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .q-card {
      background: #0b0f19;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      transition: border-color 0.2s;
    }
    .q-card.selected { border-color: var(--accent); }
    .q-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .q-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--accent-light);
      color: #a5b4fc;
      cursor: pointer;
    }
    .q-actions { display: flex; gap: 4px; }
    .icon-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: var(--text-muted);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .icon-btn:hover { color: #fff; background: #374151; }
    .icon-btn.del:hover { color: #fca5a5; border-color: #ef4444; }

    .opt-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .opt-pick {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .opt-pick.correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
    }

    /* Simulador 9:16 do Quiz */
    .sim-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .phone-frame {
      width: 280px;
      height: 498px;
      border-radius: 22px;
      border: 3px solid #334155;
      overflow: hidden;
      position: relative;
      font-family: 'Poppins', sans-serif;
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    }
    .sim-header {
      width: 100%;
      padding: 7px 12px;
      border-radius: 9px;
      background: rgba(15, 23, 42, 0.75);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
    }
    .sim-dots {
      width: 100%;
      display: grid;
      gap: 5px;
      margin-top: 10px;
    }
    .sim-dot { height: 4px; border-radius: 99px; background: rgba(255,255,255,0.28); }
    .sim-cat {
      margin-top: 14px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .sim-qbox {
      width: 100%;
      margin-top: 8px;
      padding: 14px 12px;
      border-radius: 12px;
      background: #fff;
      color: #0f172a;
      font-weight: 900;
      font-size: 13.5px;
      line-height: 1.25;
      text-align: center;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sim-clock {
      margin-top: 14px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #0f172a;
    }
    .sim-track {
      width: 94%;
      height: 5px;
      border-radius: 99px;
      background: rgba(255,255,255,0.25);
      margin-top: 12px;
      overflow: hidden;
    }
    .sim-fill { height: 100%; transition: width 0.25s linear; }
    .sim-opts {
      width: 100%;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sim-opt {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      background: #fff;
      border: 2px solid #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 800;
      color: #0f172a;
      transition: all 0.2s;
    }
    .sim-opt-let {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #0f172a;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sim-footer {
      margin-top: auto;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
    }

    /* Esteira de Produção */
    .runs-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 560px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .run-item {
      background: #0b0f19;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 13px;
    }
    .run-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .badge-status {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .status-queued { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .status-in_progress { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
    .status-completed { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .status-failed { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

    .run-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 3px; }
    .run-meta { font-size: 0.74rem; color: var(--text-muted); margin-bottom: 8px; }

    .pipeline-steps { display: flex; gap: 4px; margin-bottom: 10px; }
    .step-bar { flex: 1; height: 4px; border-radius: 2px; background: #1f2937; }
    .step-bar.done { background: var(--success); }
    .step-bar.active { background: #818cf8; animation: pulse 1.2s infinite; }
    .step-bar.fail { background: var(--danger); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .run-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .run-btn {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 6px;
      text-decoration: none;
      background: #1f2937;
      color: var(--text);
      border: 1px solid #374151;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .run-btn:hover { background: #374151; }
    .run-btn.download {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--success);
    }

    .empty-state {
      text-align: center;
      padding: 26px 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const OWNER = 'evandromqs';
    const REPO = 'creator';
    const WORKFLOW_ID = 'render.yml';

    const TEMPLATES = [
      { id: 'quiz-mobile', icon: '❓', name: 'Quiz Mobile' },
      { id: 'kinetic-shorts', icon: '⚡', name: 'Kinetic Shorts' },
      { id: 'story-loop', icon: '🔄', name: 'Story Loop' },
      { id: 'tech-viral', icon: '💻', name: 'Tech Viral' },
      { id: 'commercial-ad', icon: '📢', name: 'Comercial Ad' },
    ];

    const THEMES = {
      roxo: { label: '🟣 Roxo & Ciano', bg: '#3b0764', grad: 'linear-gradient(155deg,#4c1d95 0%,#6d28d9 45%,#3b0764 100%)', accent: '#22d3ee', clockBg: '#fde047' },
      neon: { label: '🟢 Dark Neon', bg: '#090d16', grad: 'linear-gradient(155deg,#0f172a 0%,#1e1b4b 50%,#030712 100%)', accent: '#10b981', clockBg: '#34d399' },
      cyberpunk: { label: '🩷 Cyberpunk', bg: '#18062c', grad: 'linear-gradient(155deg,#2e1065 0%,#701a75 50%,#0f0720 100%)', accent: '#f43f5e', clockBg: '#facc15' },
      esmeralda: { label: '💚 Esmeralda', bg: '#022c22', grad: 'linear-gradient(155deg,#064e3b 0%,#047857 45%,#022c22 100%)', accent: '#34d399', clockBg: '#fde047' },
      solar: { label: '🟠 Solar', bg: '#451a03', grad: 'linear-gradient(155deg,#7c2d12 0%,#9a3412 45%,#451a03 100%)', accent: '#fb923c', clockBg: '#fde047' },
    };

    const DEFAULT_QUIZ = [
      { q: 'Qual país tem mais ilhas no mundo?', opts: ['Indonésia', 'Filipinas', 'Suécia'], ans: 'Suécia', category: 'GEOGRAFIA' },
      { q: 'Qual é a capital da Austrália?', opts: ['Sydney', 'Melbourne', 'Canberra'], ans: 'Canberra', category: 'GEOGRAFIA' },
      { q: 'Qual país é conhecido como a Terra do Sol Nascente?', opts: ['China', 'Japão', 'Coreia do Sul'], ans: 'Japão', category: 'GEOGRAFIA' },
      { q: 'Qual é o rio mais longo do mundo?', opts: ['Rio Amazonas', 'Rio Nilo', 'Rio Yangtzé'], ans: 'Rio Nilo', category: 'GEOGRAFIA' },
      { q: 'Qual país possui a maior extensão de costa marítima do mundo?', opts: ['Rússia', 'Austrália', 'Canadá'], ans: 'Canadá', category: 'GEOGRAFIA' },
      { q: 'Qual é o menor país do mundo em território?', opts: ['Mônaco', 'Vaticano', 'San Marino'], ans: 'Vaticano', category: 'GEOGRAFIA' },
    ];

    function slugify(str) {
      return String(str || '')
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function sleepMs(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    async function extractFirstFileFromZip(arrayBuffer, mimeType = 'application/octet-stream') {
      const bytes = new Uint8Array(arrayBuffer);
      const view = new DataView(arrayBuffer);
      let eocdOffset = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
        if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) {
          eocdOffset = i;
          break;
        }
      }
      if (eocdOffset === -1) throw new Error('Arquivo ZIP inválido (EOCD não encontrado).');

      const cdOffset = view.getUint32(eocdOffset + 16, true);
      if (view.getUint32(cdOffset, true) !== 0x02014b50) {
        throw new Error('Cabeçalho Central Directory inválido no ZIP.');
      }

      const compressionMethod = view.getUint16(cdOffset + 10, true);
      const compressedSize = view.getUint32(cdOffset + 20, true);
      const localHeaderOffset = view.getUint32(cdOffset + 42, true);
      if (view.getUint32(localHeaderOffset, true) !== 0x04034b50) {
        throw new Error('Cabeçalho local inválido no ZIP.');
      }

      const fileNameLen = view.getUint16(localHeaderOffset + 26, true);
      const extraLen = view.getUint16(localHeaderOffset + 28, true);
      const dataStart = localHeaderOffset + 30 + fileNameLen + extraLen;
      const compressedSlice = arrayBuffer.slice(dataStart, dataStart + compressedSize);

      if (compressionMethod === 0) {
        return new Blob([compressedSlice], { type: mimeType });
      }
      if (compressionMethod === 8) {
        const ds = new DecompressionStream('deflate-raw');
        const stream = new Blob([compressedSlice]).stream().pipeThrough(ds);
        const decompressedBlob = await new Response(stream).blob();
        return new Blob([decompressedBlob], { type: mimeType });
      }
      throw new Error(`Método de compressão ZIP não suportado: ${compressionMethod}`);
    }

    async function ghApi(token, endpoint, options = {}) {
      if (!token) throw new Error('Insira seu GitHub Token para continuar.');
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/${endpoint}`, {
        ...options,
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json',
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      });
      if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        throw new Error(errorData.message || `Erro HTTP ${res.status}`);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    async function dispatchRender(token, { template, title, customData, theme = 'roxo', mode = 'full' }) {
      try {
        return await ghApi(token, `actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: 'POST',
          body: JSON.stringify({
            ref: 'main',
            inputs: { template, video_title: title, custom_data: customData, theme, mode },
          }),
        });
      } catch (err) {
        if (String(err.message).includes('Unexpected inputs')) {
          return ghApi(token, `actions/workflows/${WORKFLOW_ID}/dispatches`, {
            method: 'POST',
            body: JSON.stringify({
              ref: 'main',
              inputs: { template, video_title: title, custom_data: customData },
            }),
          });
        }
        throw err;
      }
    }

    async function generateQuizWithGroq(groqKey, theme, count, model) {
      if (!groqKey) throw new Error('Insira sua Groq API Key nas credenciais para gerar roteiros com IA.');
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${groqKey}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model,
          temperature: 0.7,
          messages: [
            {
              role: 'system',
              content: 'Retorne APENAS um JSON válido no formato {"questions":[{"q":"pergunta curta","opts":["op1","op2","op3"],"ans":"op_correta"}]} sem markdown e sem texto extra. Cada pergunta deve ter EXATAMENTE 3 opções em opts, e ans deve ser exatamente igual a uma delas.',
            },
            {
              role: 'user',
              content: `Gere ${count} perguntas de quiz sobre "${theme}" em português do Brasil, curtas, corretas e envolventes para TikTok/Reels.`,
            },
          ],
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `Erro Groq HTTP ${res.status}`);
      }
      const data = await res.json();
      let content = data.choices[0].message.content.trim();
      content = content.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
      const parsed = JSON.parse(content);
      const list = Array.isArray(parsed) ? parsed : parsed.questions;
      if (!Array.isArray(list) || list.length === 0) throw new Error('Formato inesperado retornado pela IA.');
      const catLabel = theme.toUpperCase();
      return list.map(item => ({
        q: String(item.q || ''),
        opts: Array.isArray(item.opts) ? item.opts.slice(0, 3) : ['A', 'B', 'C'],
        ans: String(item.ans || (item.opts && item.opts[0]) || ''),
        category: item.category || catLabel,
      }));
    }

    function QuizPhonePreview({ questions, activeIdx, themeKey, clockValue, revealed, onPrev, onNext, onToggleReveal }) {
      const theme = THEMES[themeKey] || THEMES.roxo;
      const total = questions.length || 1;
      const idx = Math.min(activeIdx, total - 1);
      const item = questions[idx] || { q: 'Adicione uma pergunta...', opts: ['A', 'B', 'C'], ans: 'A', category: 'QUIZ' };
      const progressPct = revealed ? 100 : ((5 - Math.min(5, Math.max(0, clockValue))) / 5) * 100;

      return (
        <div className="sim-wrap">
          <div className="phone-frame" style={{ background: theme.grad }}>
            <div className="sim-header" style={{ border: `1.5px solid ${theme.accent}`, boxShadow: `0 0 12px ${theme.accent}44` }}>
              <span>QUIZ MOBILE</span>
              <span>RODADA {idx + 1}/{total}</span>
            </div>
            <div className="sim-dots" style={{ gridTemplateColumns: `repeat(${total}, 1fr)` }}>
              {questions.map((_, i) => (
                <span
                  key={i}
                  className="sim-dot"
                  style={
                    i === idx
                      ? { background: theme.accent, boxShadow: `0 0 8px ${theme.accent}` }
                      : i < idx
                        ? { background: theme.accent, opacity: 0.55 }
                        : undefined
                  }
                />
              ))}
            </div>
            <div className="sim-cat" style={{ color: theme.accent }}>
              {(item.category || 'QUIZ').toUpperCase()}
            </div>
            <div className="sim-qbox" style={{ border: `2.5px solid ${theme.accent}` }}>
              {item.q || 'Pergunta sem texto'}
            </div>
            <div className="sim-clock" style={{ background: revealed ? '#4ade80' : theme.clockBg }}>
              {revealed ? '0' : clockValue}
            </div>
            <div className="sim-track">
              <div className="sim-fill" style={{ width: `${progressPct}%`, background: theme.accent }} />
            </div>
            <div className="sim-opts">
              {(item.opts || []).slice(0, 3).map((opt, oi) => {
                const isCorrect = opt === item.ans;
                const style = revealed
                  ? isCorrect
                    ? { background: '#4ade80', borderColor: '#fff', transform: 'scale(1.03)' }
                    : { opacity: 0.45 }
                  : {};
                return (
                  <div key={oi} className="sim-opt" style={style}>
                    <span className="sim-opt-let">{['A', 'B', 'C'][oi]}</span>
                    <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{opt}</span>
                    {revealed && isCorrect && <span>✓</span>}
                  </div>
                );
              })}
            </div>
            <div className="sim-footer">@QUIZMOBILE</div>
          </div>
          <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center' }}>
            <button className="btn-secondary" type="button" onClick={onPrev}>◀</button>
            <span style={{ fontSize: '0.78rem', color: 'var(--text-muted)', fontWeight: 700 }}>
              Rodada {idx + 1} / {total}
            </span>
            <button className="btn-secondary" type="button" onClick={onNext}>▶</button>
            <button className="btn-secondary" type="button" onClick={onToggleReveal}>
              {revealed ? '🙈 Ocultar Resposta' : '👁️ Ver Resposta'}
            </button>
          </div>
        </div>
      );
    }

    function App() {

      const [questions, setQuestions] = useState(DEFAULT_QUIZ);
      const [jsonText, setJsonText] = useState(() => JSON.stringify(DEFAULT_QUIZ, null, 2));
      const [jsonError, setJsonError] = useState('');
      const [editorTab, setEditorTab] = useState('visual'); // 'visual' | 'json'
      const [scriptText, setScriptText] = useState('');

      const [activeIdx, setActiveIdx] = useState(0);
      const [simClock, setSimClock] = useState(5);
      const [simRevealed, setSimRevealed] = useState(false);

      const [aiLoading, setAiLoading] = useState(false);
      const [batchLoading, setBatchLoading] = useState(false);
      const [dispatchLoading, setDispatchLoading] = useState(false);
      const [cloudAudioLoading, setCloudAudioLoading] = useState(false);
      const [instantPlaying, setInstantPlaying] = useState(false);
      const [localVideoLoading, setLocalVideoLoading] = useState(false);
      const [localVideoUrl, setLocalVideoUrl] = useState('');

      const [audioStatus, setAudioStatus] = useState('');

      const activeTicTacRef = useRef(null);

      const [runs, setRuns] = useState([]);

      const isLocal = location.hostname === '127.0.0.1' || location.hostname === 'localhost';

      function syncQuestions(nextList) {
        setQuestions(nextList);
        setJsonText(JSON.stringify(nextList, null, 2));
        setJsonError('');
        if (activeIdx >= nextList.length) {
          setActiveIdx(Math.max(0, nextList.length - 1));
        }
      }

      function handleJsonChange(val) {
        setJsonText(val);
        try {
          const parsed = JSON.parse(val);
          const arr = Array.isArray(parsed) ? parsed : parsed.questions;
          if (!Array.isArray(arr) || arr.length === 0) throw new Error('Informe um array com ao menos 1 pergunta.');

          setJsonError('');
        } catch (err) {
          setJsonError(err.message);
        }
      }

      function saveToken() {
        const val = ghDraft.trim();
        if (val) {
          localStorage.setItem('creator_gh_token', val);
          setGhToken(val);
          fetchRuns(val);
        } else {
          localStorage.removeItem('creator_gh_token');
          setGhToken('');
          setRuns([]);
        }
      }

      function saveGroq() {
        const val = groqDraft.trim();
        if (val) {

      async function fetchRuns(overrideToken) {
        const tk = overrideToken !== undefined ? overrideToken : ghToken;

        try {

        }

      useEffect(() => {
        if (!ghToken) return;
        fetchRuns(ghToken);
        const id = setInterval(() => fetchRuns(ghToken), 20000);
        return () => clearInterval(id);
      }, [ghToken]);

      const kpis = useMemo(() => {
        const active = runs.filter(r => r.status === 'queued' || r.status === 'in_progress').length;
        const success = runs.filter(r => r.status === 'completed' && r.conclusion === 'success').length;
        const fail = runs.filter(r => r.status === 'completed' && r.conclusion !== 'success').length;
        return { total: runs.length, active, success, fail };
      }, [runs]);

      const filteredRuns = useMemo(() => {
        if (runFilter === 'active') return runs.filter(r => r.status === 'queued' || r.status === 'in_progress');
        if (runFilter === 'success') return runs.filter(r => r.status === 'completed' && r.conclusion === 'success');
        if (runFilter === 'fail') return runs.filter(r => r.status === 'completed' && r.conclusion !== 'success');
        return runs;
      }, [runs, runFilter]);

      function setAudioUrlAndPlay(url, statusMsg) {
        setAudioSrc(url);
        setAudioStatus(statusMsg);

          if (audioRef.current) {
            audioRef.current.load();
            audioRef.current.play().catch(() => {});
          }
        }, 60);
      }

      function setAudioBlob(blob, statusMsg) {
        if (audioObjUrlRef.current) URL.revokeObjectURL(audioObjUrlRef.current);
        const objUrl = URL.createObjectURL(blob);
        audioObjUrlRef.current = objUrl;
        setAudioUrlAndPlay(objUrl, statusMsg);
      }

      async function handleGenerateAi() {
        const firstTheme = quizTheme.split(',')[0].trim() || 'Curiosidades Gerais';
        setAiLoading(true);
        try {
          const generated = await generateQuizWithGroq(groqKey || groqDraft.trim(), firstTheme, Number(quizCount) || 6, groqModel);
          syncQuestions(generated);
          setActiveIdx(0);
          setSimRevealed(false);
          setSimClock(5);

        }
      }

      async function handleBatchDispatch() {
        const themes = quizTheme.split(',').map(t => t.trim()).filter(Boolean);
        if (themes.length === 0) return alert('Informe ao menos um tema.');
        if (!ghToken) { setShowKeys(true); return alert('Salve seu GitHub Token primeiro.'); }
        if (!confirm(`Gerar e disparar ${themes.length} vídeo(s) em lote?\nTemas: ${themes.join(', ')}`)) return;

        setBatchLoading(true);
        try {
          for (const th of themes) {
            const list = await generateQuizWithGroq(groqKey || groqDraft.trim(), th, Number(quizCount) || 6, groqModel);
            const title = `quiz-${slugify(th)}-${Math.floor(Math.random() * 900 + 100)}`;

          setTimeout(() => fetchRuns(), 2500);
        } catch (err) {
          alert(`❌ Erro no lote: ${err.message}`);
        } finally {
          setBatchLoading(false);
        }
      }

      async function handleCloudAudio() {
        if (jsonError) return alert('Corrija o JSON antes de gerar o áudio.');
        const category = quizTheme.split(',')[0].trim();

        setCloudAudioLoading(true);
        if (isLocal) {
          setAudioStatus('Sintetizando Francisca 0.9x + tic-tac contínuo localmente...');
          try {
            const res = await fetch('/api/preview-audio', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ questions, theme: visualTheme, category }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `Erro HTTP ${res.status}`);
            setAudioUrlAndPlay(data.audioUrl, '✅ Áudio oficial (Francisca + tic-tac) pronto!');
            if (data.videoPreviewUrl) setLocalVideoUrl(data.videoPreviewUrl);
          } catch (err) {
            setAudioStatus('');
            alert(`❌ Erro ao gerar áudio: ${err.message}`);
          } finally {
            setCloudAudioLoading(false);
          }
          return;
        }

        if (!ghToken) {
          setCloudAudioLoading(false);
          setShowKeys(true);
          return alert('Salve seu GitHub Token nas credenciais para gerar áudio oficial na nuvem (ou use "⚡ Prévia Instantânea").');
        }

        const title = (videoTitle.trim() || 'quiz-audio') + '-preview';
        try {
          setAudioStatus('1/3 Enviando roteiro para sintetização online (Francisca 0.9x + tic-tac)...');
          const prevRunsData = await ghApi(ghToken, `actions/workflows/${WORKFLOW_ID}/runs?per_page=1`);
          const prevLatestId = prevRunsData.workflow_runs?.[0]?.id || 0;

          await dispatchRender(ghToken, {
            template: 'quiz-mobile',
            title,
            customData: JSON.stringify(questions),
            theme: visualTheme,
            mode: 'audio_only',
          });
          fetchRuns();

          let targetRun = null;
          for (let attempt = 0; attempt < 45; attempt++) {
            await sleepMs(4000);
            const runsData = await ghApi(ghToken, `actions/workflows/${WORKFLOW_ID}/runs?per_page=5`);
            const found = (runsData.workflow_runs || []).find(r => r.id > prevLatestId);
            if (found) {
              targetRun = found;
              if (found.status === 'queued') {
                setAudioStatus(`2/3 Na fila do GitHub Actions (#${found.run_number})...`);
              } else if (found.status === 'in_progress') {
                setAudioStatus(`2/3 Sintetizando voz Francisca + mixando tic-tac (#${found.run_number})...`);
              } else if (found.status === 'completed') {
                break;
              }
            }
          }

          if (!targetRun || targetRun.status !== 'completed') {
            throw new Error('Tempo limite aguardando o áudio na nuvem. Acompanhe na Esteira.');
          }
          if (targetRun.conclusion !== 'success') {
            throw new Error(`Falha na geração online (${targetRun.conclusion}). Confira o log na Esteira.`);
          }

          setAudioStatus('3/3 Baixando e extraindo MP3 oficial no navegador...');
          const artData = await ghApi(ghToken, `actions/runs/${targetRun.id}/artifacts`);
          const audioArt = (artData.artifacts || []).find(a => a.name.endsWith('-audio')) || (artData.artifacts || [])[0];
          if (!audioArt) throw new Error('Artefato de áudio não encontrado.');

          const zipRes = await fetch(audioArt.archive_download_url, {
            headers: { Authorization: `Bearer ${ghToken}` },
          });
          if (!zipRes.ok) throw new Error(`Erro ao baixar artefato (${zipRes.status})`);
          const mp3Blob = await extractFirstFileFromZip(await zipRes.arrayBuffer(), 'audio/mpeg');
          setAudioBlob(mp3Blob, '✅ Áudio oficial (Francisca 0.9x + tic-tac) pronto! Ouça abaixo.');
          fetchRuns();
        } catch (err) {
          setAudioStatus(`❌ ${err.message}`);
          alert(`❌ ${err.message}`);
        } finally {
          setCloudAudioLoading(false);
        }
      }

      function speakTextPt(text) {
        return new Promise((resolve) => {
          if (instantAbortRef.current) return resolve();
          const utt = new SpeechSynthesisUtterance(text);
          const voices = window.speechSynthesis.getVoices();
          const ptVoice =
            voices.find(v => /francisca/i.test(v.name)) ||
            voices.find(v => /pt[-_]BR/i.test(v.lang)) ||
            voices.find(v => /^pt/i.test(v.lang));
          if (ptVoice) utt.voice = ptVoice;
          utt.lang = 'pt-BR';
          utt.rate = 0.9;
          utt.onend = () => resolve();
          utt.onerror = () => resolve();
          window.speechSynthesis.speak(utt);
        });
      }

      async function handleInstantPreview() {
        if (!('speechSynthesis' in window)) return alert('Seu navegador não suporta Web Speech API.');
        if (!questions.length) return alert('Adicione ao menos 1 pergunta.');

        instantAbortRef.current = false;
        window.speechSynthesis.cancel();
        setInstantPlaying(true);

        const playOneSfx = (path) => {
          if (instantAbortRef.current) return;
          const a = new Audio(path);
          a.volume = 0.85;
          a.play().catch(() => {});
        };

        try {
          for (let i = 0; i < questions.length && !instantAbortRef.current; i++) {
            const q = questions[i];
            setActiveIdx(i);
            setSimRevealed(false);
            setSimClock(5);
            setAudioStatus(`⚡ Rodada ${i + 1}/${questions.length}: Pergunta...`);
            await speakTextPt(q.q);
            if (instantAbortRef.current) break;
            await sleepMs(350);

            const letters = ['A', 'B', 'C'];
            for (let oi = 0; oi < 3 && !instantAbortRef.current; oi++) {
              await speakTextPt(`${letters[oi]}:`);
              if (instantAbortRef.current) break;
              await sleepMs(200);
              await speakTextPt(`${(q.opts || [])[oi] || ''}?`);
              if (instantAbortRef.current) break;
              await sleepMs(oi < 2 ? 300 : 450);
            }

            if (activeTicTacRef.current) {
              activeTicTacRef.current.pause();
              activeTicTacRef.current = null;
            }
            const tictac = new Audio('sfx/tic-tac.mp3');
            tictac.loop = true;
            tictac.volume = 0.45;
            tictac.play().catch(() => {});
            activeTicTacRef.current = tictac;

            for (const n of [5, 4, 3, 2, 1]) {
              if (instantAbortRef.current) break;
              setSimClock(n);
              setAudioStatus(`⚡ Rodada ${i + 1}/${questions.length}: Contagem ${n}...`);
              await speakTextPt(String(n));
              if (instantAbortRef.current) break;
              await sleepMs(700);
            }

            if (activeTicTacRef.current) {
              activeTicTacRef.current.pause();
              activeTicTacRef.current.currentTime = 0;
              activeTicTacRef.current = null;
            }
            if (instantAbortRef.current) break;

            setSimClock(0);
            setSimRevealed(true);
            setAudioStatus(`⚡ Rodada ${i + 1}/${questions.length}: Resposta!`);
            playOneSfx('sfx/trim_alarm.mp3');
            await speakTextPt(`Resposta certa: ${q.ans}!`);
            if (instantAbortRef.current) break;
            await sleepMs(900);
          }
          if (!instantAbortRef.current) setAudioStatus('✅ Prévia instantânea concluída!');
        } finally {
          if (activeTicTacRef.current) {
            activeTicTacRef.current.pause();
            activeTicTacRef.current = null;
          }
          setInstantPlaying(false);
        }
      }

      function stopInstantPreview() {
        instantAbortRef.current = true;
        if (activeTicTacRef.current) {
          activeTicTacRef.current.pause();
          activeTicTacRef.current = null;
        }
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setInstantPlaying(false);
        setAudioStatus('⏹ Prévia interrompida.');
      }

      async function handleLocalVideoCompile() {

      async function handleDispatchRender() {
        if (!ghToken) { setShowKeys(true); return alert('Salve seu GitHub Token primeiro.'); }
        if (template === 'quiz-mobile' && jsonError) return alert('JSON do Quiz inválido!');

      async function handlePlayRunAudio(runId) {
        try {
          const data = await ghApi(ghToken, `actions/runs/${runId}/artifacts`);
          const audioArt = (data.artifacts || []).find(a => a.name.endsWith('-audio'));
          if (!audioArt) throw new Error('Artefato de áudio (-audio) não encontrado nesta execução.');
          const res = await fetch(audioArt.archive_download_url, { headers: { Authorization: `Bearer ${ghToken}` } });
          if (!res.ok) throw new Error(`Erro ao baixar (${res.status})`);
          const mp3Blob = await extractFirstFileFromZip(await res.arrayBuffer(), 'audio/mpeg');
          setAudioBlob(mp3Blob, `✅ Reproduzindo áudio: ${audioArt.name}`);
          audioRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } catch (err) {
          alert(`❌ ${err.message}`);
        }
      }

      async function handleDownloadRun(runId) {
        try {
          const data = await ghApi(ghToken, `actions/runs/${runId}/artifacts`);
          const artifacts = data.artifacts || [];
          const artifact = artifacts.find(a => !a.name.endsWith('-audio')) || artifacts[0];
          if (!artifact) throw new Error('Artefato não encontrado ou expirado.');
          const res = await fetch(artifact.archive_download_url, { headers: { Authorization: `Bearer ${ghToken}` } });
          if (!res.ok) throw new Error(`Erro ao baixar (${res.status})`);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${artifact.name || 'video'}.zip`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (err) {
          alert(`❌ ${err.message}`);
        }
      }

      // Funções de edição visual de perguntas
      function updateQuestion(idx, patch) {
        const next = questions.map((item, i) => (i === idx ? { ...item, ...patch } : item));
        syncQuestions(next);
      }

      function updateOption(qIdx, optIdx, newText) {
        const q = questions[qIdx];
        const prevText = q.opts[optIdx];
        const newOpts = q.opts.map((o, i) => (i === optIdx ? newText : o));
        const newAns = q.ans === prevText ? newText : q.ans;
        updateQuestion(qIdx, { opts: newOpts, ans: newAns });
      }

      function moveQuestion(idx, delta) {
        const target = idx + delta;
        if (target < 0 || target >= questions.length) return;
        const copy = [...questions];
        const [item] = copy.splice(idx, 1);
        copy.splice(target, 0, item);
        syncQuestions(copy);
        setActiveIdx(target);
      }

      function duplicateQuestion(idx) {
        const copy = [...questions];
        const item = questions[idx];
        copy.splice(idx + 1, 0, { ...item, opts: [...item.opts] });
        syncQuestions(copy);
        setActiveIdx(idx + 1);
      }

      function deleteQuestion(idx) {
        if (questions.length <= 1) return alert('Mantenha pelo menos 1 pergunta.');
        const next = questions.filter((_, i) => i !== idx);
        syncQuestions(next);
      }

      function shuffleOptions(idx) {
        const q = questions[idx];
        const opts = [...q.opts];
        for (let i = opts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        updateQuestion(idx, { opts });
      }

      function addQuestion() {
        const cat = (quizTheme.split(',')[0].trim() || 'QUIZ').toUpperCase();
        const next = [...questions, { q: 'Nova pergunta aqui?', opts: ['Opção A', 'Opção B', 'Opção C'], ans: 'Opção A', category: cat }];
        syncQuestions(next);
        setActiveIdx(next.length - 1);
      }

      return (
        <div>
          <header>
            <div className="brand">
              <span>🎬</span>
              <span>Creator Studio</span>
              <span className="brand-badge">React SPA · GitHub Cloud</span>
            </div>
            <div className="header-right">
              <button
                type="button"
                className={`status-pill ${ghToken ? 'ok' : 'warn'}`}
                onClick={() => setShowKeys(v => !v)}
              >
                <span>{ghToken ? '🟢 GitHub Conectado' : '🟡 Configurar GitHub Token'}</span>
              </button>
              <button
                type="button"
                className={`status-pill ${groqKey ? 'ok' : 'warn'}`}
                onClick={() => setShowKeys(v => !v)}
              >
                <span>{groqKey ? '🟢 Groq IA Ativo' : '⚪ Groq API Key'}</span>
              </button>
              <a href="https://github.com/evandromqs/creator" target="_blank" rel="noreferrer" className="repo-link">
                <span>GitHub Repo</span>
              </a>
            </div>
          </header>

          <div className="container">
            {/* KPIs */}
            <div className="kpi-grid">
              <div className="kpi-card">
                <span className="kpi-label">Total na Esteira</span>
                <span className="kpi-value accent">{ghToken ? kpis.total : '—'}</span>
              </div>
              <div className="kpi-card">
                <span className="kpi-label">Em Produção</span>
                <span className="kpi-value warning">{ghToken ? kpis.active : '—'}</span>
              </div>
              <div className="kpi-card">
                <span className="kpi-label">Prontos</span>
                <span className="kpi-value success">{ghToken ? kpis.success : '—'}</span>
              </div>
              <div className="kpi-card">
                <span className="kpi-label">Falhas</span>
                <span className="kpi-value danger">{ghToken ? kpis.fail : '—'}</span>
              </div>
            </div>

            {/* Credenciais Seguras */}
            {showKeys && (
              <div className="card token-box">
                <div className="card-title">
                  <span>🔐 Credenciais Locais (Salvas apenas no navegador via LocalStorage)</span>
                  <button className="btn-secondary" type="button" onClick={() => setShowKeys(false)} style={{ padding: '4px 10px' }}>Fechar</button>
                </div>
                <div className="row-2">
                  <div className="form-group" style={{ marginBottom: 0 }}>
                    <label>GitHub Token (escopo <code>workflow</code>)</label>
                    <div style={{ display: 'flex', gap: '6px' }}>
                      <input type="password" value={ghDraft} onChange={e => setGhDraft(e.target.value)} placeholder="ghp_... ou gho_..." autoComplete="off" />
                      <button className="btn-secondary" type="button" onClick={saveToken}>Salvar</button>
                    </div>
                  </div>
                  <div className="form-group" style={{ marginBottom: 0 }}>
                    <label>Groq API Key (IA para Roteiros)</label>
                    <div style={{ display: 'flex', gap: '6px' }}>
                      <input type="password" value={groqDraft} onChange={e => setGroqDraft(e.target.value)} placeholder="gsk_..." autoComplete="off" />
                      <button className="btn-secondary" type="button" onClick={saveGroq}>Salvar</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            <div className="main-grid">
              {/* Coluna Principal: Criação e Editor */}
              <div>
                <div className="card">
                  <div className="card-title">
                    <span>🏭 Linha de Produção</span>
                  </div>

                  <div className="form-group">
                    <label>1. Escolha o Template</label>
                    <div className="templates-grid">
                      {TEMPLATES.map(t => (
                        <div
                          key={t.id}
                          className={`tpl-btn ${template === t.id ? 'active' : ''}`}
                          onClick={() => setTemplate(t.id)}
                        >
                          <span className="icon">{t.icon}</span>
                          <span className="name">{t.name}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {template === 'quiz-mobile' ? (
                    <>
                      <div className="ai-box">
                        <div style={{ fontWeight: 700, fontSize: '0.86rem', marginBottom: '10px', color: '#34d399' }}>
                          ✨ Gerador Automático de Roteiro (Groq IA)
                        </div>
                        <div className="row-2" style={{ marginBottom: '10px' }}>
                          <div>
                            <label>Tema (ou vários separados por vírgula para Lote)</label>
                            <input type="text" value={quizTheme} onChange={e => setQuizTheme(e.target.value)} placeholder="Ex: Curiosidades do Brasil" />
                          </div>
                          <div>
                            <label>Modelo Groq</label>
                            <select value={groqModel} onChange={e => setGroqModel(e.target.value)}>
                              <option value="openai/gpt-oss-120b">openai/gpt-oss-120b (Melhor qualidade)</option>
                              <option value="openai/gpt-oss-20b">openai/gpt-oss-20b (Mais rápido)</option>
                            </select>
                          </div>
                        </div>
                        <div style={{ display: 'flex', gap: '8px', alignItems: 'flex-end', flexWrap: 'wrap' }}>
                          <div style={{ width: '96px' }}>
                            <label>Perguntas</label>
                            <input type="number" min="1" max="10" value={quizCount} onChange={e => setQuizCount(e.target.value)} />
                          </div>
                          <button className="btn-ai" type="button" onClick={handleGenerateAi} disabled={aiLoading}>
                            {aiLoading ? '⏳ Gerando...' : '✨ Gerar Roteiro'}
                          </button>
                          <button className="btn-secondary" type="button" onClick={handleBatchDispatch} disabled={batchLoading}>
                            {batchLoading ? '⏳ Enviando lote...' : '🚀 Disparar Lote'}
                          </button>
                        </div>
                      </div>

                      <div className="row-2">
                        <div className="form-group">
                          <label>2. Título / Identificador do Vídeo</label>
                          <input type="text" value={videoTitle} onChange={e => setVideoTitle(e.target.value)} />
                        </div>
                        <div className="form-group">
                          <label>Tema Visual do Quiz</label>
                          <select value={visualTheme} onChange={e => setVisualTheme(e.target.value)}>
                            {Object.entries(THEMES).map(([k, v]) => (
                              <option key={k} value={k}>{v.label}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="form-group">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px', flexWrap: 'wrap', gap: '8px' }}>
                          <div className="tabs">
                            <button type="button" className={`tab-btn ${editorTab === 'visual' ? 'active' : ''}`} onClick={() => setEditorTab('visual')}>
                              ✨ Editor Visual ({questions.length})
                            </button>
                            <button type="button" className={`tab-btn ${editorTab === 'json' ? 'active' : ''}`} onClick={() => setEditorTab('json')}>
                              💻 Código JSON
                            </button>
                          </div>
                          <div style={{ display: 'flex', gap: '6px' }}>
                            {editorTab === 'visual' && (
                              <button className="btn-secondary" type="button" onClick={addQuestion} style={{ padding: '4px 10px', fontSize: '0.75rem' }}>
                                + Pergunta
                              </button>
                            )}
                            <button className="btn-secondary" type="button" onClick={() => syncQuestions(DEFAULT_QUIZ)} style={{ padding: '4px 10px', fontSize: '0.75rem' }}>
                              Exemplo
                            </button>
                          </div>
                        </div>

                        {editorTab === 'visual' ? (
                          <div className="q-list">
                            {questions.map((item, qIdx) => (
                              <div key={qIdx} className={`q-card ${activeIdx === qIdx ? 'selected' : ''}`} onClick={() => setActiveIdx(qIdx)}>
                                <div className="q-card-top">
                                  <span className="q-badge">Rodada {qIdx + 1}</span>
                                  <div className="q-actions" onClick={e => e.stopPropagation()}>
                                    <button type="button" className="icon-btn" title="Mover acima" onClick={() => moveQuestion(qIdx, -1)}>↑</button>
                                    <button type="button" className="icon-btn" title="Mover abaixo" onClick={() => moveQuestion(qIdx, 1)}>↓</button>
                                    <button type="button" className="icon-btn" title="Embaralhar opções" onClick={() => shuffleOptions(qIdx)}>🔀</button>
                                    <button type="button" className="icon-btn" title="Duplicar" onClick={() => duplicateQuestion(qIdx)}>📄</button>
                                    <button type="button" className="icon-btn del" title="Excluir" onClick={() => deleteQuestion(qIdx)}>🗑️</button>
                                  </div>
                                </div>
                                <div className="row-2" style={{ marginBottom: '6px' }}>
                                  <input
                                    type="text"
                                    value={item.q}
                                    onChange={e => updateQuestion(qIdx, { q: e.target.value })}
                                    placeholder="Texto da pergunta"
                                    style={{ fontWeight: 600 }}
                                  />
                                  <input
                                    type="text"
                                    value={item.category || ''}
                                    onChange={e => updateQuestion(qIdx, { category: e.target.value })}
                                    placeholder="Categoria (ex: GEOGRAFIA)"
                                  />
                                </div>
                                {(item.opts || []).slice(0, 3).map((opt, oi) => {
                                  const isAns = opt === item.ans;
                                  return (
                                    <div key={oi} className="opt-row">
                                      <button
                                        type="button"
                                        className={`opt-pick ${isAns ? 'correct' : ''}`}
                                        title="Clique para marcar como resposta correta"
                                        onClick={() => updateQuestion(qIdx, { ans: opt })}
                                      >
                                        {['A', 'B', 'C'][oi]}
                                      </button>
                                      <input
                                        type="text"
                                        value={opt}
                                        onChange={e => updateOption(qIdx, oi, e.target.value)}
                                      />
                                    </div>
                                  );
                                })}
                              </div>
                            ))}
                          </div>
                        ) : (
                          <>
                            <textarea value={jsonText} onChange={e => handleJsonChange(e.target.value)} spellCheck="false" />
                            {jsonError && <div style={{ color: 'var(--danger)', fontSize: '0.76rem', marginTop: '4px' }}>⚠️ {jsonError}</div>}
                          </>
                        )}

                        <div style={{ marginTop: '12px', display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                          <button className="btn-ai" type="button" onClick={handleCloudAudio} disabled={cloudAudioLoading}>
                            {cloudAudioLoading ? '⏳ Gerando Áudio...' : '☁️ Gerar Áudio Online (Francisca + SFX)'}
                          </button>
                          {!instantPlaying ? (
                            <button className="btn-secondary" type="button" onClick={handleInstantPreview}>
                              ⚡ Prévia Instantânea (0s)
                            </button>
                          ) : (
                            <button className="btn-secondary" type="button" onClick={stopInstantPreview} style={{ color: '#f87171' }}>
                              ⏹ Parar Prévia
                            </button>
                          )}
                          {isLocal && (
                            <button className="btn-secondary" type="button" onClick={handleLocalVideoCompile} disabled={localVideoLoading}>
                              {localVideoLoading ? '⏳ Compilando...' : '🎬 Preview GSAP (Local)'}
                            </button>
                          )}
                        </div>
                        {audioStatus && (
                          <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginTop: '8px' }}>{audioStatus}</div>
                        )}
                        {audioSrc && (
                          <audio ref={audioRef} src={audioSrc} controls style={{ width: '100%', marginTop: '10px' }} />
                        )}
                        {localVideoUrl && (
                          <div style={{ marginTop: '12px', textAlign: 'center' }}>
                            <iframe src={localVideoUrl} style={{ width: '300px', height: '533px', border: '2px solid var(--accent)', borderRadius: '14px', background: '#000' }} />
                          </div>
                        )}
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="form-group">
                        <label>2. Título / Identificador do Vídeo</label>
                        <input type="text" value={videoTitle} onChange={e => setVideoTitle(e.target.value)} placeholder="Ex: video-01" />
                      </div>
                      <div className="form-group">
                        <label>3. Roteiro / Texto da Narração</label>
                        <textarea value={scriptText} onChange={e => setScriptText(e.target.value)} placeholder="Digite o roteiro completo aqui..." spellCheck="false" />
                      </div>
                    </>
                  )}

                  <button className="btn-primary" type="button" onClick={handleDispatchRender} disabled={dispatchLoading}>
                    {dispatchLoading ? <div className="spinner" /> : <span>🚀</span>}
                    <span>{dispatchLoading ? 'Enviando para Esteira...' : 'Disparar Renderização na Esteira'}</span>
                  </button>
                </div>
              </div>

              {/* Coluna Direita: Simulador 9:16 + Esteira */}
              <div>
                {template === 'quiz-mobile' && (
                  <div className="card">
                    <div className="card-title">
                      <span>📱 Simulador 9:16 Ao Vivo</span>
                      <span style={{ fontSize: '0.74rem', color: 'var(--text-muted)' }}>{THEMES[visualTheme]?.label}</span>
                    </div>
                    <QuizPhonePreview
                      questions={questions}
                      activeIdx={activeIdx}
                      themeKey={visualTheme}
                      clockValue={simClock}
                      revealed={simRevealed}
                      onPrev={() => { setSimRevealed(false); setSimClock(5); setActiveIdx(i => (i - 1 + questions.length) % questions.length); }}
                      onNext={() => { setSimRevealed(false); setSimClock(5); setActiveIdx(i => (i + 1) % questions.length); }}
                      onToggleReveal={() => { setSimRevealed(v => !v); setSimClock(v => (simRevealed ? 5 : 0)); }}
                    />
                  </div>
                )}

                <div className="card">
                  <div className="card-title">
                    <span>📊 Esteira em Tempo Real</span>
                    <button className="btn-secondary" type="button" onClick={() => fetchRuns()} style={{ padding: '4px 10px', fontSize: '0.74rem' }}>
                      🔄 Atualizar
                    </button>
                  </div>

                  <div className="tabs" style={{ marginBottom: '12px' }}>
                    {[
                      ['all', `Todos (${kpis.total})`],
                      ['active', `Produção (${kpis.active})`],
                      ['success', `Prontos (${kpis.success})`],
                      ['fail', `Falhas (${kpis.fail})`],
                    ].map(([key, lbl]) => (
                      <button
                        key={key}
                        type="button"
                        className={`tab-btn ${runFilter === key ? 'active' : ''}`}
                        onClick={() => setRunFilter(key)}
                        style={{ flex: 1, fontSize: '0.7rem', padding: '5px 4px' }}
                      >
                        {lbl}
                      </button>
                    ))}
                  </div>

                  <div className="runs-list">
                    {!ghToken ? (
                      <div className="empty-state">Configure seu GitHub Token para acompanhar a esteira.</div>
                    ) : runsError ? (
                      <div className="empty-state" style={{ color: 'var(--danger)' }}>{runsError}</div>
                    ) : filteredRuns.length === 0 ? (
                      <div className="empty-state">Nenhuma execução nesta aba.</div>
                    ) : (
                      filteredRuns.map(run => {
                        let statusClass = 'status-queued';
                        let statusLabel = 'Na Fila';
                        let s1 = 'done', s2 = 'active', s3 = '';
                        if (run.status === 'in_progress') {
                          statusClass = 'status-in_progress';
                          statusLabel = 'Em Produção...';
                          s1 = 'done'; s2 = 'done'; s3 = 'active';
                        } else if (run.status === 'completed') {
                          if (run.conclusion === 'success') {
                            statusClass = 'status-completed';
                            statusLabel = 'Pronto!';
                            s1 = 'done'; s2 = 'done'; s3 = 'done';
                          } else {
                            statusClass = 'status-failed';
                            statusLabel = 'Falhou';
                            s1 = 'done'; s2 = 'done'; s3 = 'fail';
                          }
                        }
                        const created = new Date(run.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        const isDone = run.status === 'completed' && run.conclusion === 'success';
                        return (
                          <div key={run.id} className="run-item">
                            <div className="run-header">
                              <span className={`badge-status ${statusClass}`}>{statusLabel}</span>
                              <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>{created}</span>
                            </div>
                            <div className="run-title">{run.display_title || 'Render Video'}</div>
                            <div className="run-meta">Execução #{run.run_number}</div>
                            <div className="pipeline-steps">
                              <div className={`step-bar ${s1}`} />
                              <div className={`step-bar ${s2}`} />
                              <div className={`step-bar ${s3}`} />
                            </div>
                            <div className="run-actions">
                              {isDone && (
                                <>
                                  <button type="button" className="run-btn" onClick={() => handlePlayRunAudio(run.id)}>🔊 Ouvir MP3</button>
                                  <button type="button" className="run-btn download" onClick={() => handleDownloadRun(run.id)}>⬇️ Baixar (.zip)</button>
                                </>
                              )}
                              <a href={run.html_url} target="_blank" rel="noreferrer" className="run-btn">Acompanhar Log</a>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
