<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Studio — Automação de Vídeos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --surface: #0f1623;
      --card: #111827;
      --card-border: #1e293b;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.14);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, rgba(99,102,241,0.08), transparent 45%), var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--card-border);
      background: rgba(15, 22, 35, 0.88);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.12rem;
      letter-spacing: -0.4px;
    }
    .brand-badge {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      padding: 3px 9px;
      border-radius: 7px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .status-pill.ok { border-color: rgba(16, 185, 129, 0.4); color: #34d399; }
    .status-pill.warn { border-color: rgba(245, 158, 11, 0.45); color: #fbbf24; }
    .status-pill:hover { border-color: var(--accent); color: #fff; }

    .container {
      max-width: 1340px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 18px 48px;
    }

    /* KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 800px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kpi-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-value { font-size: 1.55rem; font-weight: 800; margin-top: 2px; }
    .kpi-value.accent { color: #818cf8; }
    .kpi-value.warning { color: var(--warning); }
    .kpi-value.success { color: var(--success); }
    .kpi-value.danger { color: var(--danger); }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 410px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1060px) { .main-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
    }
    .token-box {
      background: rgba(99, 102, 241, 0.06);
      border: 1px solid rgba(99, 102, 241, 0.28);
    }

    .step-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .step-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.98rem;
      font-weight: 800;
    }
    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--accent-soft);
      color: #a5b4fc;
      font-size: 0.78rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      background: #090e1a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 9px 11px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.86rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }
    textarea {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.79rem;
      min-height: 185px;
      resize: vertical;
      line-height: 1.5;
    }
    textarea.prose {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem;
      min-height: 145px;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .row-2, .row-3 { grid-template-columns: 1fr; } }

    .templates-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    @media (max-width: 720px) { .templates-grid { grid-template-columns: repeat(2, 1fr); } }

    .tpl-btn {
      background: #090e1a;
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s;
      color: var(--text);
    }
    .tpl-btn:hover { border-color: #475569; transform: translateY(-1px); }
    .tpl-btn.active { border-color: var(--accent); background: var(--accent-soft); }
    .tpl-btn .icon { font-size: 1.25rem; display: block; margin-bottom: 3px; }
    .tpl-btn .name { font-size: 0.76rem; font-weight: 800; display: block; }
    .tpl-btn .desc { font-size: 0.66rem; color: var(--text-muted); margin-top: 2px; display: block; }

    /* Chips de sugestão */
    .chips-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .chip-btn {
      background: #090e1a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip-btn:hover { border-color: #10b981; color: #34d399; }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
    }
    .btn-primary:hover { opacity: 0.95; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 0.79rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn-secondary:hover { background: #334155; }
    .btn-secondary:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-ai {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 15px;
      font-size: 0.81rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-ai:hover { opacity: 0.92; }
    .btn-ai:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Progress Bar de Áudio */
    .audio-panel {
      background: #090e1a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 13px;
      margin-top: 12px;
      margin-bottom: 14px;
    }
    .progress-wrap {
      margin-top: 10px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      background: #090e1a;
      padding: 4px;
      border-radius: 9px;
      border: 1px solid var(--card-border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }

    /* Editor Visual */
    .q-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .q-card {
      background: #090e1a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 11px;
    }
    .q-card.selected { border-color: var(--accent); }
    .q-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .q-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 5px;
      background: var(--accent-soft);
      color: #a5b4fc;
    }
    .q-actions { display: flex; gap: 4px; }
    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text-muted);
      border-radius: 5px;
      padding: 3px 6px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .icon-btn:hover { color: #fff; background: #334155; }
    .icon-btn.del:hover { color: #fca5a5; border-color: #ef4444; }

    .opt-row { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
    .opt-pick {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid #334155;
      background: #1e293b;
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .opt-pick.correct {
      background: rgba(16, 185, 129, 0.22);
      border-color: #10b981;
      color: #34d399;
    }

    /* Simulador 9:16 */
    .sim-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .phone-frame {
      width: 268px;
      height: 476px;
      border-radius: 22px;
      border: 3px solid #334155;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    }
    .sim-header {
      width: 100%;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.75);
      display: flex;
      justify-content: space-between;
      font-size: 9.5px;
      font-weight: 900;
      color: #fff;
    }
    .sim-dots { width: 100%; display: grid; gap: 4px; margin-top: 9px; }
    .sim-dot { height: 4px; border-radius: 99px; background: rgba(255,255,255,0.28); }
    .sim-cat { margin-top: 12px; font-size: 9.5px; font-weight: 900; letter-spacing: 1.4px; }
    .sim-qbox {
      width: 100%;
      margin-top: 8px;
      padding: 12px 10px;
      border-radius: 11px;
      background: #fff;
      color: #0f172a;
      font-weight: 900;
      font-size: 13px;
      line-height: 1.24;
      text-align: center;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sim-clock {
      margin-top: 12px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 19px;
      color: #0f172a;
    }
    .sim-track { width: 94%; height: 5px; border-radius: 99px; background: rgba(255,255,255,0.25); margin-top: 10px; overflow: hidden; }
    .sim-fill { height: 100%; transition: width 0.25s linear; }
    .sim-opts { width: 100%; margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
    .sim-opt {
      width: 100%;
      padding: 7px 9px;
      border-radius: 9px;
      background: #fff;
      border: 2px solid #0f172a;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 800;
      color: #0f172a;
    }
    .sim-opt-let {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: #0f172a;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sim-footer { margin-top: auto; font-size: 8.5px; font-weight: 900; letter-spacing: 1px; color: #fff; }

    /* Esteira */
    .runs-list { display: flex; flex-direction: column; gap: 9px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
    .run-item { background: #090e1a; border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; }
    .run-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .badge-status { font-size: 0.66rem; font-weight: 800; padding: 2px 7px; border-radius: 5px; text-transform: uppercase; }
    .status-queued { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .status-in_progress { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
    .status-completed { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .status-failed { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .run-title { font-weight: 700; font-size: 0.86rem; margin-bottom: 2px; }
    .run-meta { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 8px; }
    .pipeline-steps { display: flex; gap: 4px; margin-bottom: 9px; }
    .step-bar { flex: 1; height: 4px; border-radius: 2px; background: #1e293b; }
    .step-bar.done { background: var(--success); }
    .step-bar.active { background: #818cf8; animation: pulse 1.2s infinite; }
    .step-bar.fail { background: var(--danger); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .run-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .run-btn {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      text-decoration: none;
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .run-btn:hover { background: #334155; }
    .run-btn.download { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: var(--success); }
    .empty-state { text-align: center; padding: 24px 10px; color: var(--text-muted); font-size: 0.83rem; }
    .spinner { width: 15px; height: 15px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

    async function fetchEdgeTtsBytes(text, voice = 'pt-BR-FranciscaNeural', rate = '0.9') {
      const key = `${voice}|${rate}|${text}`;
      if (ttsCache.has(key)) return ttsCache.get(key);
      const url = `${EDGE_TTS_WORKER_URL}?text=${encodeURIComponent(text)}&rate=${encodeURIComponent(rate)}&voice=${encodeURIComponent(voice)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Erro TTS Worker (${res.status})`);
      const buf = await res.arrayBuffer();
      ttsCache.set(key, buf);
      return buf;
    }

    function trimAudioBufferSilence(ctx, buf, threshold = 0.008) {
      const data = buf.getChannelData(0);
      const pad = Math.floor(buf.sampleRate * 0.02);
      let start = 0;
      while (start < data.length && Math.abs(data[start]) <= threshold) start++;
      let end = data.length - 1;
      while (end > start && Math.abs(data[end]) <= threshold) end--;
      start = Math.max(0, start - pad);
      end = Math.min(data.length - 1, end + pad);
      const len = Math.max(1, end - start + 1);
      const out = ctx.createBuffer(buf.numberOfChannels, len, buf.sampleRate);
      for (let ch = 0; ch < buf.numberOfChannels; ch++) {
        out.copyToChannel(buf.getChannelData(ch).subarray(start, end + 1), ch);
      }
      return out;
    }

    function audioBufferToWavBlob(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const length = buffer.length;
      const blockAlign = numChannels * 2;
      const dataSize = length * blockAlign;
      const wavBuffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(wavBuffer);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);

      const channels = Array.from({ length: numChannels }, (_, ch) => buffer.getChannelData(ch));
      let offset = 44;
      for (let i = 0; i < length; i++) {
        for (let ch = 0; ch < numChannels; ch++) {
          const s = Math.max(-1, Math.min(1, channels[ch][i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
          offset += 2;
        }
      }
      return new Blob([wavBuffer], { type: 'audio/wav' });
    }

    async function buildFullQuizAudioViaWorker(questions, voice, onProgress) {
      const textsSet = new Set([OUTRO_TEXT, '5', '4', '3', '2', '1', 'A:', 'B:', 'C:']);
      questions.forEach(item => {
        textsSet.add(item.q);
        (item.opts || []).slice(0, 3).forEach(opt => textsSet.add(`${opt}?`));
        textsSet.add(`Resposta certa: ${item.ans}!`);
      });
      const uniqueTexts = Array.from(textsSet);

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx({ sampleRate: 44100 });
      try {
        onProgress(8, `Preparando ${uniqueTexts.length} falas + SFX...`);
        const rawMap = new Map();
        const CONCURRENCY = 6;
        let completed = 0;
        for (let i = 0; i < uniqueTexts.length; i += CONCURRENCY) {
          const batch = uniqueTexts.slice(i, i + CONCURRENCY);
          await Promise.all(batch.map(async t => {
            const bytes = await fetchEdgeTtsBytes(t, voice, '0.9');
            const decoded = await ctx.decodeAudioData(bytes.slice(0));
            rawMap.set(t, trimAudioBufferSilence(ctx, decoded));
            completed++;
            const pct = 10 + Math.round((completed / uniqueTexts.length) * 65);
            onProgress(pct, `Sintetizando voz (${completed}/${uniqueTexts.length})...`);
          }));
        }

        onProgress(80, 'Carregando tic-tac.mp3 e trim_alarm.mp3...');
        const [tictacBuf, trimBuf] = await Promise.all([
          fetch('sfx/tic-tac.mp3').then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b)),
          fetch('sfx/trim_alarm.mp3').then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b)),
        ]);

        const events = [];
        const roundsMeta = [];
        let cursor = 0;
        for (const item of questions) {
          const qBuf = rawMap.get(item.q);
          events.push({ buf: qBuf, at: cursor });
          cursor += qBuf.duration + 0.35;

          for (let oi = 0; oi < 3; oi++) {
            const letBuf = rawMap.get(['A:', 'B:', 'C:'][oi]);
            events.push({ buf: letBuf, at: cursor });
            cursor += letBuf.duration + 0.2;

            const optBuf = rawMap.get(`${(item.opts || [])[oi] || ''}?`);
            events.push({ buf: optBuf, at: cursor });
            cursor += optBuf.duration + (oi < 2 ? 0.3 : 0.45);
          }

          const startCue = cursor;
          for (const n of ['5', '4', '3', '2', '1']) {
            const nBuf = rawMap.get(n);
            events.push({ buf: nBuf, at: cursor });
            cursor += nBuf.duration + 0.7;
          }
          const revealAt = cursor;
          roundsMeta.push({ startCue, revealAt });

          const ansBuf = rawMap.get(`Resposta certa: ${item.ans}!`);
          events.push({ buf: ansBuf, at: cursor });
          cursor += ansBuf.duration + 0.9;
        }
        const outroBuf = rawMap.get(OUTRO_TEXT);
        events.push({ buf: outroBuf, at: cursor });
        cursor += outroBuf.duration;

        onProgress(92, 'Mixando pausas + tic-tac contínuo + trim_alarm...');
        const offline = new OfflineAudioContext(2, Math.ceil((cursor + 0.5) * 44100), 44100);
        for (const ev of events) {
          const src = offline.createBufferSource();
          src.buffer = ev.buf;
          src.connect(offline.destination);
          src.start(ev.at);
        }
        for (const rm of roundsMeta) {
          const ttSrc = offline.createBufferSource();
          ttSrc.buffer = tictacBuf;
          ttSrc.loop = true;
          const ttGain = offline.createGain();
          const fadeSt = Math.max(rm.startCue, rm.revealAt - 0.12);
          ttGain.gain.setValueAtTime(0.45, rm.startCue);
          ttGain.gain.setValueAtTime(0.45, fadeSt);
          ttGain.gain.linearRampToValueAtTime(0.0001, rm.revealAt);
          ttSrc.connect(ttGain);
          ttGain.connect(offline.destination);
          ttSrc.start(rm.startCue);
          ttSrc.stop(rm.revealAt + 0.01);

          const alSrc = offline.createBufferSource();
          alSrc.buffer = trimBuf;
          const alGain = offline.createGain();
          alGain.gain.setValueAtTime(0.85, rm.revealAt);
          alSrc.connect(alGain);
          alGain.connect(offline.destination);
          alSrc.start(rm.revealAt);
        }
        const rendered = await offline.startRendering();
        onProgress(100, 'Áudio completo pronto!');
        return audioBufferToWavBlob(rendered);
      } finally {
        ctx.close().catch(() => {});
      }
    }

    async function buildProseNarrationViaWorker(fullText, voice, rate, onProgress) {
      const sentences = String(fullText || '')
        .split(/(?<=[.!?])\s+/)
        .map(s => s.trim())
        .filter(Boolean);
      if (sentences.length === 0) throw new Error('O texto da narração está vazio.');

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx({ sampleRate: 44100 });
      try {
        onProgress(10, `Sintetizando ${sentences.length} trecho(s) da narração...`);
        const buffers = new Array(sentences.length);
        let done = 0;
        await Promise.all(sentences.map(async (sent, idx) => {
          const bytes = await fetchEdgeTtsBytes(sent, voice, rate);
          const decoded = await ctx.decodeAudioData(bytes.slice(0));
          buffers[idx] = trimAudioBufferSilence(ctx, decoded);
          done++;
          onProgress(15 + Math.round((done / sentences.length) * 70), `Sintetizando trecho ${done}/${sentences.length}...`);
        }));

        onProgress(90, 'Finalizando faixa de narração...');
        let cursor = 0;
        const events = buffers.map(b => {
          const ev = { buf: b, at: cursor };
          cursor += b.duration + 0.22;
          return ev;
        });

        const offline = new OfflineAudioContext(2, Math.ceil((cursor + 0.4) * 44100), 44100);
        for (const ev of events) {
          const src = offline.createBufferSource();
          src.buffer = ev.buf;
          src.connect(offline.destination);
          src.start(ev.at);
        }
        const rendered = await offline.startRendering();
        onProgress(100, 'Narração pronta!');
        return audioBufferToWavBlob(rendered);
      } finally {
        ctx.close().catch(() => {});
      }
    }

    async function extractFirstFileFromZip(arrayBuffer, mimeType = 'application/octet-stream') {
      const bytes = new Uint8Array(arrayBuffer);
      const view = new DataView(arrayBuffer);
      let eocdOffset = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
        if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) {
          eocdOffset = i;
          break;
        }
      }
      if (eocdOffset === -1) throw new Error('Arquivo ZIP inválido (EOCD não encontrado).');
      const cdOffset = view.getUint32(eocdOffset + 16, true);
      const compressionMethod = view.getUint16(cdOffset + 10, true);
      const compressedSize = view.getUint32(cdOffset + 20, true);
      const localHeaderOffset = view.getUint32(cdOffset + 42, true);
      const fileNameLen = view.getUint16(localHeaderOffset + 26, true);
      const extraLen = view.getUint16(localHeaderOffset + 28, true);
      const dataStart = localHeaderOffset + 30 + fileNameLen + extraLen;
      const compressedSlice = arrayBuffer.slice(dataStart, dataStart + compressedSize);
      if (compressionMethod === 0) return new Blob([compressedSlice], { type: mimeType });
      if (compressionMethod === 8) {
        const ds = new DecompressionStream('deflate-raw');
        const stream = new Blob([compressedSlice]).stream().pipeThrough(ds);
        const decompressedBlob = await new Response(stream).blob();
        return new Blob([decompressedBlob], { type: mimeType });
      }
      throw new Error(`Compressão ZIP não suportada: ${compressionMethod}`);
    }

    async function ghApi(token, endpoint, options = {}) {
      if (!token) throw new Error('Insira seu GitHub Token para continuar.');
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/${endpoint}`, {
        ...options,
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json',
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      });
      if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        throw new Error(errorData.message || `Erro HTTP ${res.status}`);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    async function dispatchRender(token, { template, title, customData, theme = 'roxo', mode = 'full' }) {

            method: 'POST',
            body: JSON.stringify({ ref: 'main', inputs: { template, video_title: title, custom_data: customData } }),

        throw err;
      }
    }

    async function callGroqJson(groqKey, model, systemPrompt, userPrompt) {
      if (!groqKey) throw new Error('Configure sua Groq API Key no topo para gerar roteiros com IA.');
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { Authorization: `Bearer ${groqKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model,
          temperature: 0.75,
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: userPrompt },
          ],
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `Erro Groq HTTP ${res.status}`);
      }
      const data = await res.json();
      let content = data.choices[0].message.content.trim();
      content = content.replace(/^```(?:json)?\s*/i, '').replace(/```$/i, '').trim();
      return content;
    }

        if (tplId === 'kinetic-shorts' || tplId === 'tech-viral') {
          setScriptText(DEFAULT_PROSE[tplId]);
        }
        setVideoTitle(`${tplId.split('-')[0]}-${Math.floor(Math.random() * 900 + 100)}`);
      }

      function syncQuestions(nextList) {
        setQuestions(nextList);
        setJsonText(JSON.stringify(nextList, null, 2));
        setJsonError('');
        if (activeIdx >= nextList.length) setActiveIdx(Math.max(0, nextList.length - 1));
      }

      function handleJsonChange(val) {
        setJsonText(val);
        try {
          const parsed = JSON.parse(val);
          const arr = Array.isArray(parsed) ? parsed : parsed.questions;
          if (!Array.isArray(arr) || arr.length === 0) throw new Error('Informe um array com ao menos 1 pergunta.');
          setQuestions(arr);
          setJsonError('');
        } catch (err) {
          setJsonError(err.message);
        }
      }

      function saveToken() {
        const val = ghDraft.trim();
        if (val) { localStorage.setItem('creator_gh_token', val); setGhToken(val); fetchRuns(val); }
        else { localStorage.removeItem('creator_gh_token'); setGhToken(''); setRuns([]); }
      }

      function saveGroq() {
        const val = groqDraft.trim();
        if (val) { localStorage.setItem('creator_groq_key', val); setGroqKey(val); }
        else { localStorage.removeItem('creator_groq_key'); setGroqKey(''); }
      }

      async function fetchRuns(overrideToken) {
        const tk = overrideToken !== undefined ? overrideToken : ghToken;
        if (!tk) return;
        try {
          const data = await ghApi(tk, `actions/workflows/${WORKFLOW_ID}/runs?per_page=15`);
          setRuns(data.workflow_runs || []);
          setRunsError('');
        } catch (err) {
          setRunsError(err.message);
        }
      }

      useEffect(() => {
        if (!ghToken) return;
        fetchRuns(ghToken);
        const id = setInterval(() => fetchRuns(ghToken), 20000);
        return () => clearInterval(id);
      }, [ghToken]);

      const kpis = useMemo(() => {
        const active = runs.filter(r => r.status === 'queued' || r.status === 'in_progress').length;
        const success = runs.filter(r => r.status === 'completed' && r.conclusion === 'success').length;
        const fail = runs.filter(r => r.status === 'completed' && r.conclusion !== 'success').length;
        return { total: runs.length, active, success, fail };
      }, [runs]);

      const filteredRuns = useMemo(() => {
        if (runFilter === 'active') return runs.filter(r => r.status === 'queued' || r.status === 'in_progress');
        if (runFilter === 'success') return runs.filter(r => r.status === 'completed' && r.conclusion === 'success');
        if (runFilter === 'fail') return runs.filter(r => r.status === 'completed' && r.conclusion !== 'success');
        return runs;
      }, [runs, runFilter]);

      function setAudioUrlAndPlay(url, statusMsg) {
        setAudioSrc(url);
        setAudioStatus(statusMsg);
        setTimeout(() => {
          if (audioRef.current) {
            audioRef.current.load();
            audioRef.current.play().catch(() => {});
          }
        }, 60);
      }

      function setAudioBlob(blob, statusMsg) {
        if (audioObjUrlRef.current) URL.revokeObjectURL(audioObjUrlRef.current);
        const objUrl = URL.createObjectURL(blob);
        audioObjUrlRef.current = objUrl;
        setAudioUrlAndPlay(objUrl, statusMsg);
      }

      async function handleGenerateAi() {
        const key = groqKey || groqDraft.trim();
        const topic = aiTopic.split(',')[0].trim() || 'Curiosidades';
        setAiLoading(true);
        try {
          if (template === 'quiz-mobile') {
            const raw = await callGroqJson(
              key,
              groqModel,
              'Retorne APENAS um JSON válido no formato {"questions":[{"q":"pergunta curta","opts":["op1","op2","op3"],"ans":"op_correta"}]} sem markdown. Cada pergunta deve ter EXATAMENTE 3 opções em opts, e ans deve ser exatamente igual a uma delas.',
              `Gere ${Number(quizCount) || 6} perguntas de quiz sobre "${topic}" (nível ${aiTone}) em português do Brasil, curtas e envolventes para TikTok/Reels.`
            );
            const parsed = JSON.parse(raw);
            const list = Array.isArray(parsed) ? parsed : parsed.questions;
            const cat = topic.toUpperCase();
            syncQuestions(list.map(i => ({
              q: String(i.q || ''),
              opts: Array.isArray(i.opts) ? i.opts.slice(0, 3) : ['A', 'B', 'C'],
              ans: String(i.ans || i.opts?.[0] || ''),
              category: i.category || cat,
            })));
            setActiveIdx(0);
            setSimRevealed(false);
            setSimClock(5);
            setVideoTitle(`quiz-${slugify(topic)}-${Math.floor(Math.random() * 900 + 100)}`);
          } else if (template === 'story-loop') {
            const raw = await callGroqJson(
              key,
              groqModel,
              'Retorne APENAS um JSON válido no formato {"title":"Título curto","loopHook":"frase gancho","scenes":[{"id":"scene-1","eyebrow":"Capítulo 1","title":"Título 1","text":"Frase curta 1","start":0,"end":6},{"id":"scene-2","eyebrow":"Capítulo 2","title":"Título 2","text":"Frase curta 2","start":6,"end":13},{"id":"scene-3","eyebrow":"Capítulo 3","title":"Título 3","text":"Frase curta 3 conectando de volta ao início","start":13,"end":20}]} sem markdown.',
              `Crie uma história curta em loop infinito sobre "${topic}" com tom "${aiTone}" em português do Brasil.`
            );
            const obj = JSON.parse(raw);
            setStoryData(obj);
            setVideoTitle(`story-${slugify(topic)}-${Math.floor(Math.random() * 900 + 100)}`);
          } else if (template === 'commercial-ad') {
            const raw = await callGroqJson(
              key,
              groqModel,
              'Retorne APENAS um JSON válido no formato {"tag":"TAG CURTA","headline":"2 PALAVRAS","highlight":"DESTAQUE","headlineEnd":"FIM","sub":"Subtítulo curto","cards":["✓ Benefício 1","✓ Benefício 2","✓ Benefício 3"],"ctaTitle":"COMECE","ctaHighlight":"AGORA","ctaButton":"TEXTO BOTÃO","narrationText":"Texto completo de locução comercial de 18 segundos em português"} sem markdown.',
              `Crie um anúncio comercial de alta conversão para "${topic}" com tom "${aiTone}".`
            );
            const obj = JSON.parse(raw);
            setAdData(obj);
            setVideoTitle(`ad-${slugify(topic)}-${Math.floor(Math.random() * 900 + 100)}`);
          } else {
            const targetWords = template === 'kinetic-shorts' ? '85 a 110 palavras' : '110 a 140 palavras';
            const raw = await callGroqJson(
              key,
              groqModel,
              'Você é um roteirista especialista em retenção para YouTube Shorts e Reels. Retorne APENAS o texto puro da narração, sem títulos, sem marcações de cena e sem aspas.',
              `Escreva um roteiro narrado (${targetWords}) sobre "${topic}" no estilo "${template}" com tom "${aiTone}". Comece com um gancho forte e termine com uma pergunta para comentários.`
            );
            setScriptText(raw.replace(/^["']|["']$/g, '').trim());
            setVideoTitle(`${template.split('-')[0]}-${slugify(topic)}-${Math.floor(Math.random() * 900 + 100)}`);
          }
        } catch (err) {
          alert(`❌ ${err.message}`);
        } finally {
          setAiLoading(false);
        }
      }

      async function handleBatchDispatch() {
        const themes = aiTopic.split(',').map(t => t.trim()).filter(Boolean);
        if (!themes.length) return alert('Informe ao menos um tema.');
        if (!ghToken) { setShowKeys(true); return alert('Salve seu GitHub Token primeiro.'); }
        if (!confirm(`Gerar e disparar ${themes.length} vídeo(s) em lote?\nTemas: ${themes.join(', ')}`)) return;

        const key = groqKey || groqDraft.trim();
        setBatchLoading(true);
        try {
          for (const th of themes) {
            const raw = await callGroqJson(
              key,
              groqModel,
              'Retorne APENAS um JSON válido no formato {"questions":[{"q":"pergunta curta","opts":["op1","op2","op3"],"ans":"op_correta"}]} sem markdown.',
              `Gere ${Number(quizCount) || 6} perguntas de quiz sobre "${th}" (nível ${aiTone}) em português do Brasil.`
            );
            const parsed = JSON.parse(raw);
            const list = (Array.isArray(parsed) ? parsed : parsed.questions).map(i => ({ ...i, category: th.toUpperCase() }));
            const title = `quiz-${slugify(th)}-${Math.floor(Math.random() * 900 + 100)}`;
            await dispatchRender(ghToken, { template: 'quiz-mobile', title, customData: JSON.stringify(list), theme: visualTheme, mode: 'full' });
          }
          alert(`✅ Lote de ${themes.length} vídeo(s) enviado para a esteira!`);
          setTimeout(() => fetchRuns(), 2500);
        } catch (err) {
          alert(`❌ Erro no lote: ${err.message}`);
        } finally {
          setBatchLoading(false);
        }
      }

      async function handleGenerateAudio() {
        if (template === 'quiz-mobile' && jsonError) return alert('Corrija o JSON antes de gerar o áudio.');

        setAudioLoading(true);
        setAudioProgress(5);

        if (template === 'quiz-mobile' && isLocal) {
          setAudioStatus('Sintetizando Francisca 0.9x + tic-tac contínuo localmente...');
          const timer = setInterval(() => setAudioProgress(p => (p < 88 ? p + 4 : p)), 450);
          try {
            const res = await fetch('/api/preview-audio', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ questions, theme: visualTheme, category: aiTopic.split(',')[0].trim() }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `Erro HTTP ${res.status}`);
            setAudioProgress(100);
            setAudioUrlAndPlay(data.audioUrl, '✅ Áudio oficial (Francisca + tic-tac) pronto!');
            if (data.videoPreviewUrl) setLocalVideoUrl(data.videoPreviewUrl);
          } catch (err) {
            setAudioProgress(0);
            setAudioStatus(`❌ ${err.message}`);
            alert(`❌ ${err.message}`);
          } finally {
            clearInterval(timer);
            setAudioLoading(false);
          }
          return;
        }

        try {
          let blob;
          if (template === 'quiz-mobile') {
            blob = await buildFullQuizAudioViaWorker(questions, voiceName, (pct, msg) => {
              setAudioProgress(pct);
              setAudioStatus(msg);
            });
            setAudioBlob(blob, '✅ Áudio completo (Francisca 0.9x + tic-tac + trim_alarm) pronto!');
          } else {
            const textToSpeak = template === 'story-loop'
              ? (storyData.scenes || []).map(s => s.text).filter(Boolean).join(' ')
              : template === 'commercial-ad'
                ? adData.narrationText
                : scriptText;
            const rate = voiceName === 'pt-BR-FranciscaNeural' ? '0.9' : '0.95';
            blob = await buildProseNarrationViaWorker(textToSpeak, voiceName, rate, (pct, msg) => {
              setAudioProgress(pct);
              setAudioStatus(msg);
            });
            setAudioBlob(blob, `✅ Narração (${voiceName.replace('pt-BR-', '').replace('Neural', '')}) pronta!`);
          }
        } catch (err) {
          setAudioProgress(0);
          setAudioStatus(`❌ ${err.message}`);
          alert(`❌ Erro ao gerar áudio: ${err.message}`);
        } finally {
          setAudioLoading(false);
        }
      }

      function playMp3Bytes(bytes) {
        return new Promise((resolve) => {
          if (instantAbortRef.current) return resolve();
          const url = URL.createObjectURL(new Blob([bytes.slice(0)], { type: 'audio/mpeg' }));
          const audio = new Audio(url);
          activeSpeechAudioRef.current = audio;
          const cleanup = () => {
            if (activeSpeechAudioRef.current === audio) activeSpeechAudioRef.current = null;
            URL.revokeObjectURL(url);
            resolve();
          };
          audio.onended = cleanup;
          audio.onerror = cleanup;
          audio.play().catch(cleanup);
        });
      }

      async function speakEdge(text) {
        if (instantAbortRef.current) return;
        const bytes = await fetchEdgeTtsBytes(text, voiceName, '0.9');
        if (!instantAbortRef.current) await playMp3Bytes(bytes);
      }

      async function handleInstantPreview() {
        if (!questions.length) return alert('Adicione ao menos 1 pergunta.');
        instantAbortRef.current = false;
        setInstantPlaying(true);

        const playOneSfx = (path) => {
          if (instantAbortRef.current) return;
          const a = new Audio(path);
          a.volume = 0.85;
          a.play().catch(() => {});
        };

        try {
          Promise.all(['5', '4', '3', '2', '1', 'A:', 'B:', 'C:'].map(t => fetchEdgeTtsBytes(t, voiceName, '0.9'))).catch(() => {});
          for (let i = 0; i < questions.length && !instantAbortRef.current; i++) {
            const q = questions[i];
            setActiveIdx(i);
            setSimRevealed(false);
            setSimClock(5);
            setAudioStatus(`⚡ Carregando fala (Rodada ${i + 1}/${questions.length})...`);
            await Promise.all([q.q, `${q.opts?.[0] || ''}?`, `${q.opts?.[1] || ''}?`, `${q.opts?.[2] || ''}?`, `Resposta certa: ${q.ans}!`].map(t => fetchEdgeTtsBytes(t, voiceName, '0.9').catch(() => null)));
            if (instantAbortRef.current) break;

            setAudioStatus(`⚡ Rodada ${i + 1}/${questions.length}: Pergunta...`);
            await speakEdge(q.q);
            if (instantAbortRef.current) break;
            await sleepMs(350);

            for (let oi = 0; oi < 3 && !instantAbortRef.current; oi++) {
              await speakEdge(['A:', 'B:', 'C:'][oi]);
              if (instantAbortRef.current) break;
              await sleepMs(200);
              await speakEdge(`${(q.opts || [])[oi] || ''}?`);
              if (instantAbortRef.current) break;
              await sleepMs(oi < 2 ? 300 : 450);
            }

            if (activeTicTacRef.current) { activeTicTacRef.current.pause(); activeTicTacRef.current = null; }
            const tictac = new Audio('sfx/tic-tac.mp3');
            tictac.loop = true;
            tictac.volume = 0.45;
            tictac.play().catch(() => {});
            activeTicTacRef.current = tictac;

            for (const n of [5, 4, 3, 2, 1]) {
              if (instantAbortRef.current) break;
              setSimClock(n);
              setAudioStatus(`⚡ Rodada ${i + 1}/${questions.length}: Contagem ${n}...`);
              await speakEdge(String(n));
              if (instantAbortRef.current) break;
              await sleepMs(700);
            }

            if (activeTicTacRef.current) { activeTicTacRef.current.pause(); activeTicTacRef.current = null; }
            if (instantAbortRef.current) break;

            setSimClock(0);
            setSimRevealed(true);
            setAudioStatus(`⚡ Rodada ${i + 1}/${questions.length}: Resposta!`);
            playOneSfx('sfx/trim_alarm.mp3');
            await speakEdge(`Resposta certa: ${q.ans}!`);
            if (instantAbortRef.current) break;
            await sleepMs(900);
          }
          if (!instantAbortRef.current) setAudioStatus('✅ Prévia ao vivo concluída!');
        } finally {
          if (activeSpeechAudioRef.current) { activeSpeechAudioRef.current.pause(); activeSpeechAudioRef.current = null; }
          if (activeTicTacRef.current) { activeTicTacRef.current.pause(); activeTicTacRef.current = null; }
          setInstantPlaying(false);
        }
      }

      function stopInstantPreview() {
        instantAbortRef.current = true;
        if (activeSpeechAudioRef.current) { activeSpeechAudioRef.current.pause(); activeSpeechAudioRef.current = null; }
        if (activeTicTacRef.current) { activeTicTacRef.current.pause(); activeTicTacRef.current = null; }
        setInstantPlaying(false);
        setAudioStatus('⏹ Prévia interrompida.');
      }

      async function handleLocalVideoCompile() {
        if (!isLocal) return;
        setLocalVideoLoading(true);
        try {
          const res = await fetch('/api/compile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ template, theme: visualTheme, category: aiTopic.split(',')[0].trim(), questions, scriptText }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `Erro HTTP ${res.status}`);
          setLocalVideoUrl(data.videoPreviewUrl);
          setAudioStatus('✅ Vídeo GSAP compilado! Dê Play abaixo.');
        } catch (err) {
          alert(`❌ ${err.message}`);
        } finally {
          setLocalVideoLoading(false);
        }
      }

      async function handleDispatchRender() {
        if (!ghToken) { setShowKeys(true); return alert('Salve seu GitHub Token primeiro.'); }
        if (template === 'quiz-mobile' && jsonError) return alert('JSON do Quiz inválido!');
        const title = videoTitle.trim() || template;
        let customData = '';
        if (template === 'quiz-mobile') customData = JSON.stringify(questions);
        else if (template === 'story-loop') customData = JSON.stringify(storyData);
        else if (template === 'commercial-ad') customData = JSON.stringify(adData);
        else customData = scriptText.trim();

        setDispatchLoading(true);
        try {
          await dispatchRender(ghToken, { template, title, customData, theme: visualTheme, mode: 'full' });
          alert(`✅ "${title}" entrou na esteira de produção!`);
          setTimeout(() => fetchRuns(), 2500);
        } catch (err) {
          alert(`❌ Erro ao acionar renderização: ${err.message}`);
        } finally {
          setDispatchLoading(false);
        }
      }

      async function handlePlayRunAudio(runId) {
        try {
          const data = await ghApi(ghToken, `actions/runs/${runId}/artifacts`);
          const audioArt = (data.artifacts || []).find(a => a.name.endsWith('-audio'));
          if (!audioArt) throw new Error('Artefato de áudio (-audio) não encontrado.');
          const res = await fetch(audioArt.archive_download_url, { headers: { Authorization: `Bearer ${ghToken}` } });
          if (!res.ok) throw new Error(`Erro (${res.status})`);
          const mp3Blob = await extractFirstFileFromZip(await res.arrayBuffer(), 'audio/mpeg');
          setAudioProgress(100);
          setAudioBlob(mp3Blob, `✅ Reproduzindo áudio da execução (${audioArt.name}).`);
          audioRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } catch (err) {
          alert(`❌ ${err.message}`);
        }
      }

      async function handleDownloadRun(runId) {
        try {
          const data = await ghApi(ghToken, `actions/runs/${runId}/artifacts`);
          const artifacts = data.artifacts || [];
          const artifact = artifacts.find(a => !a.name.endsWith('-audio')) || artifacts[0];
          if (!artifact) throw new Error('Artefato não encontrado ou expirado.');
          const res = await fetch(artifact.archive_download_url, { headers: { Authorization: `Bearer ${ghToken}` } });
          if (!res.ok) throw new Error(`Erro (${res.status})`);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${artifact.name || 'video'}.zip`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (err) {
          alert(`❌ ${err.message}`);
        }
      }

      function updateQuestion(idx, patch) { syncQuestions(questions.map((item, i) => (i === idx ? { ...item, ...patch } : item))); }
      function updateOption(qIdx, optIdx, newText) {
        const q = questions[qIdx];
        const prev = q.opts[optIdx];
        const newOpts = q.opts.map((o, i) => (i === optIdx ? newText : o));
        updateQuestion(qIdx, { opts: newOpts, ans: q.ans === prev ? newText : q.ans });
      }
      function moveQuestion(idx, delta) {
        const target = idx + delta;
        if (target < 0 || target >= questions.length) return;
        const copy = [...questions];
        const [item] = copy.splice(idx, 1);
        copy.splice(target, 0, item);
        syncQuestions(copy);
        setActiveIdx(target);
      }
      function duplicateQuestion(idx) {
        const copy = [...questions];
        copy.splice(idx + 1, 0, { ...questions[idx], opts: [...questions[idx].opts] });
        syncQuestions(copy);
        setActiveIdx(idx + 1);
      }
      function deleteQuestion(idx) {
        if (questions.length <= 1) return alert('Mantenha pelo menos 1 pergunta.');
        syncQuestions(questions.filter((_, i) => i !== idx));
      }
      function shuffleOptions(idx) {
        const opts = [...questions[idx].opts];
        for (let i = opts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        updateQuestion(idx, { opts });
      }
      function addQuestion() {
        const cat = (aiTopic.split(',')[0].trim() || 'QUIZ').toUpperCase();
        const next = [...questions, { q: 'Nova pergunta aqui?', opts: ['Opção A', 'Opção B', 'Opção C'], ans: 'Opção A', category: cat }];
        syncQuestions(next);
        setActiveIdx(next.length - 1);
      }

      const toneOptions = template === 'quiz-mobile'
        ? ['Fácil', 'Médio', 'Difícil', 'Progressivo']
        : template === 'commercial-ad'
          ? ['Alta Conversão', 'Urgência & Escassez', 'Autoridade', 'Amigável']
          : ['Misterioso & Viral', 'Documentário Épico', 'Dinâmico & Curioso', 'Inspirador'];

      return (
        <div>
          <header>
            <div className="brand">
              <span>🎬</span>
              <span>Creator Studio</span>
              <span className="brand-badge">Esteira IA</span>
            </div>
            <div className="header-right">
              <span className="status-pill ok" style={{ cursor: 'default' }}>🟢 Edge TTS Ativo</span>
              <button type="button" className={`status-pill ${ghToken ? 'ok' : 'warn'}`} onClick={() => setShowKeys(v => !v)}>
                {ghToken ? '🟢 GitHub Conectado' : '🟡 Configurar GitHub'}
              </button>
              <button type="button" className={`status-pill ${groqKey ? 'ok' : 'warn'}`} onClick={() => setShowKeys(v => !v)}>
                {groqKey ? '🟢 Groq IA Ativo' : '⚪ Groq API Key'}
              </button>
              <button type="button" className="status-pill" onClick={() => setShowKeys(v => !v)}>⚙️ Chaves</button>
            </div>
          </header>

          <div className="container">
            <div className="kpi-grid">
              <div className="kpi-card"><div><div className="kpi-label">Total na Esteira</div><div className="kpi-value accent">{ghToken ? kpis.total : '—'}</div></div><span>📦</span></div>
              <div className="kpi-card"><div><div className="kpi-label">Em Produção</div><div className="kpi-value warning">{ghToken ? kpis.active : '—'}</div></div><span>⚙️</span></div>
              <div className="kpi-card"><div><div className="kpi-label">Prontos</div><div className="kpi-value success">{ghToken ? kpis.success : '—'}</div></div><span>✅</span></div>
              <div className="kpi-card"><div><div className="kpi-label">Falhas</div><div className="kpi-value danger">{ghToken ? kpis.fail : '—'}</div></div><span>⚠️</span></div>
            </div>

            {showKeys && (
              <div className="card token-box">
                <div className="step-header">
                  <div className="step-title">🔐 Credenciais Locais (LocalStorage do navegador)</div>
                  <button className="btn-secondary" type="button" onClick={() => setShowKeys(false)}>Fechar</button>
                </div>
                <div className="row-2">
                  <div className="form-group" style={{ marginBottom: 0 }}>
                    <label>GitHub Token (escopo <code>workflow</code>)</label>
                    <div style={{ display: 'flex', gap: '6px' }}>
                      <input type="password" value={ghDraft} onChange={e => setGhDraft(e.target.value)} placeholder="ghp_... ou gho_..." autoComplete="off" />
                      <button className="btn-secondary" type="button" onClick={saveToken}>Salvar</button>
                    </div>
                  </div>
                  <div className="form-group" style={{ marginBottom: 0 }}>
                    <label>Groq API Key (IA para Roteiros)</label>
                    <div style={{ display: 'flex', gap: '6px' }}>
                      <input type="password" value={groqDraft} onChange={e => setGroqDraft(e.target.value)} placeholder="gsk_..." autoComplete="off" />
                      <button className="btn-secondary" type="button" onClick={saveGroq}>Salvar</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            <div className="main-grid">
              <div>
                {/* Etapa 1 */}
                <div className="card">
                  <div className="step-header">
                    <div className="step-title"><span className="step-num">1</span><span>Formato & Estilo</span></div>
                  </div>
                  <div className="templates-grid">
                    {TEMPLATES.map(t => (
                      <div key={t.id} className={`tpl-btn ${template === t.id ? 'active' : ''}`} onClick={() => selectTemplate(t.id)}>
                        <span className="icon">{t.icon}</span>
                        <span className="name">{t.name}</span>
                        <span className="desc">{t.desc}</span>
                      </div>
                    ))}
                  </div>
                  <div className={template === 'quiz-mobile' ? 'row-3' : 'row-2'}>
                    <div className="form-group" style={{ marginBottom: 0 }}>
                      <label>Identificador do Vídeo</label>
                      <input type="text" value={videoTitle} onChange={e => setVideoTitle(e.target.value)} />
                    </div>
                    <div className="form-group" style={{ marginBottom: 0 }}>
                      <label>Voz Neural (Edge TTS)</label>
                      <select value={voiceName} onChange={e => setVoiceName(e.target.value)}>
                        <option value="pt-BR-FranciscaNeural">👩 Francisca (pt-BR · 0.9x)</option>
                        <option value="pt-BR-AntonioNeural">👨 Antonio (pt-BR · 0.95x)</option>
                      </select>
                    </div>
                    {template === 'quiz-mobile' && (
                      <div className="form-group" style={{ marginBottom: 0 }}>
                        <label>Tema Visual</label>
                        <select value={visualTheme} onChange={e => setVisualTheme(e.target.value)}>
                          {Object.entries(THEMES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                        </select>
                      </div>
                    )}
                  </div>
                </div>

                {/* Etapa 2 */}
                <div className="card">
                  <div className="step-header">
                    <div className="step-title"><span className="step-num">2</span><span>Gerador Inteligente (Groq IA)</span></div>
                    <span style={{ fontSize: '0.73rem', color: '#34d399', fontWeight: 700 }}>{TEMPLATES.find(t => t.id === template)?.name}</span>
                  </div>
                  <div className="chips-row">
                    {(QUICK_SUGGESTIONS[template] || []).map(s => (
                      <button key={s} type="button" className="chip-btn" onClick={() => setAiTopic(s)}>+ {s}</button>
                    ))}
                  </div>
                  <div className={template === 'quiz-mobile' ? 'row-3' : 'row-2'} style={{ marginBottom: '10px' }}>
                    <div>
                      <label>{template === 'quiz-mobile' ? 'Tema (vírgula = lote)' : template === 'commercial-ad' ? 'Produto / Serviço' : 'Assunto / Tema'}</label>
                      <input type="text" value={aiTopic} onChange={e => setAiTopic(e.target.value)} />
                    </div>
                    <div>
                      <label>{template === 'quiz-mobile' ? 'Dificuldade' : 'Tom do Roteiro'}</label>
                      <select value={aiTone} onChange={e => setAiTone(e.target.value)}>
                        {toneOptions.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    </div>
                    {template === 'quiz-mobile' && (
                      <div>
                        <label>Perguntas</label>
                        <input type="number" min="1" max="10" value={quizCount} onChange={e => setQuizCount(e.target.value)} />
                      </div>
                    )}
                  </div>
                  <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
                    <div style={{ minWidth: '230px', flex: '0 1 250px' }}>
                      <select value={groqModel} onChange={e => setGroqModel(e.target.value)}>
                        <option value="openai/gpt-oss-120b">openai/gpt-oss-120b (Qualidade)</option>
                        <option value="openai/gpt-oss-20b">openai/gpt-oss-20b (Rápido)</option>
                      </select>
                    </div>
                    <button className="btn-ai" type="button" onClick={handleGenerateAi} disabled={aiLoading}>
                      {aiLoading ? '⏳ Gerando com IA...' : '✨ Gerar Roteiro com IA'}
                    </button>
                    {template === 'quiz-mobile' && (
                      <button className="btn-secondary" type="button" onClick={handleBatchDispatch} disabled={batchLoading}>
                        {batchLoading ? '⏳ Enviando lote...' : '🚀 Disparar Lote'}
                      </button>
                    )}
                  </div>
                </div>

                {/* Etapa 3 */}
                <div className="card">
                  <div className="step-header">
                    <div className="step-title"><span className="step-num">3</span><span>Roteiro, Áudio & Disparo</span></div>
                    {template === 'quiz-mobile' && (
                      <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                        <div className="tabs">
                          <button type="button" className={`tab-btn ${editorTab === 'visual' ? 'active' : ''}`} onClick={() => setEditorTab('visual')}>✨ Cards ({questions.length})</button>
                          <button type="button" className={`tab-btn ${editorTab === 'json' ? 'active' : ''}`} onClick={() => setEditorTab('json')}>💻 JSON</button>
                        </div>
                        {editorTab === 'visual' && <button className="btn-secondary" type="button" onClick={addQuestion} style={{ padding: '5px 9px', fontSize: '0.74rem' }}>+ Pergunta</button>}
                      </div>
                    )}
                  </div>

                  {template === 'quiz-mobile' ? (
                    editorTab === 'visual' ? (
                      <div className="q-list">
                        {questions.map((item, qIdx) => (
                          <div key={qIdx} className={`q-card ${activeIdx === qIdx ? 'selected' : ''}`} onClick={() => setActiveIdx(qIdx)}>
                            <div className="q-card-top">
                              <span className="q-badge">Rodada {qIdx + 1}</span>
                              <div className="q-actions" onClick={e => e.stopPropagation()}>
                                <button type="button" className="icon-btn" onClick={() => moveQuestion(qIdx, -1)}>↑</button>
                                <button type="button" className="icon-btn" onClick={() => moveQuestion(qIdx, 1)}>↓</button>
                                <button type="button" className="icon-btn" onClick={() => shuffleOptions(qIdx)}>🔀</button>
                                <button type="button" className="icon-btn" onClick={() => duplicateQuestion(qIdx)}>📄</button>
                                <button type="button" className="icon-btn del" onClick={() => deleteQuestion(qIdx)}>🗑️</button>
                              </div>
                            </div>
                            <div className="row-2" style={{ marginBottom: '6px' }}>
                              <input type="text" value={item.q} onChange={e => updateQuestion(qIdx, { q: e.target.value })} style={{ fontWeight: 600 }} />
                              <input type="text" value={item.category || ''} onChange={e => updateQuestion(qIdx, { category: e.target.value })} placeholder="Categoria" />
                            </div>
                            {(item.opts || []).slice(0, 3).map((opt, oi) => (
                              <div key={oi} className="opt-row">
                                <button type="button" className={`opt-pick ${opt === item.ans ? 'correct' : ''}`} onClick={() => updateQuestion(qIdx, { ans: opt })}>{['A', 'B', 'C'][oi]}</button>
                                <input type="text" value={opt} onChange={e => updateOption(qIdx, oi, e.target.value)} />
                              </div>
                            ))}
                          </div>
                        ))}
                      </div>
                    ) : (
                      <>
                        <textarea value={jsonText} onChange={e => handleJsonChange(e.target.value)} spellCheck="false" />
                        {jsonError && <div style={{ color: 'var(--danger)', fontSize: '0.75rem', marginTop: '4px' }}>⚠️ {jsonError}</div>}
                      </>
                    )
                  ) : template === 'story-loop' ? (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                      <div className="form-group" style={{ marginBottom: 0 }}>
                        <label>Título da História</label>
                        <input type="text" value={storyData.title} onChange={e => setStoryData({ ...storyData, title: e.target.value })} />
                      </div>
                      {(storyData.scenes || []).map((sc, idx) => (
                        <div key={idx} className="q-card">
                          <div className="row-2" style={{ marginBottom: '6px' }}>
                            <input type="text" value={sc.eyebrow} onChange={e => {
                              const scenes = storyData.scenes.map((s, i) => (i === idx ? { ...s, eyebrow: e.target.value } : s));
                              setStoryData({ ...storyData, scenes });
                            }} placeholder="Capítulo" />
                            <input type="text" value={sc.title} onChange={e => {
                              const scenes = storyData.scenes.map((s, i) => (i === idx ? { ...s, title: e.target.value } : s));
                              setStoryData({ ...storyData, scenes });
                            }} placeholder="Título da Cena" />
                          </div>
                          <input type="text" value={sc.text} onChange={e => {
                            const scenes = storyData.scenes.map((s, i) => (i === idx ? { ...s, text: e.target.value } : s));
                            setStoryData({ ...storyData, scenes });
                          }} placeholder="Texto narrado na cena" />
                        </div>
                      ))}
                    </div>
                  ) : template === 'commercial-ad' ? (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                      <div className="row-3">
                        <div><label>Tag</label><input type="text" value={adData.tag} onChange={e => setAdData({ ...adData, tag: e.target.value })} /></div>
                        <div><label>Chamada</label><input type="text" value={adData.headline} onChange={e => setAdData({ ...adData, headline: e.target.value })} /></div>
                        <div><label>Destaque</label><input type="text" value={adData.highlight} onChange={e => setAdData({ ...adData, highlight: e.target.value })} /></div>
                      </div>
                      <div className="row-2">
                        <div><label>Subtítulo</label><input type="text" value={adData.sub} onChange={e => setAdData({ ...adData, sub: e.target.value })} /></div>
                        <div><label>Botão CTA</label><input type="text" value={adData.ctaButton} onChange={e => setAdData({ ...adData, ctaButton: e.target.value })} /></div>
                      </div>
                      <div className="row-3">
                        {(adData.cards || []).map((c, idx) => (
                          <div key={idx}><label>Benefício {idx + 1}</label><input type="text" value={c} onChange={e => {
                            const cards = adData.cards.map((v, i) => (i === idx ? e.target.value : v));
                            setAdData({ ...adData, cards });
                          }} /></div>
                        ))}
                      </div>
                      <div>
                        <label>Locução do Anúncio</label>
                        <textarea className="prose" style={{ minHeight: '90px' }} value={adData.narrationText} onChange={e => setAdData({ ...adData, narrationText: e.target.value })} />
                      </div>
                    </div>
                  ) : (
                    <textarea className="prose" value={scriptText} onChange={e => setScriptText(e.target.value)} placeholder="Digite ou gere o roteiro completo com IA..." />
                  )}

                  {/* Painel de Áudio + Barra de Progresso */}
                  <div className="audio-panel">
                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                      <button className="btn-ai" type="button" onClick={handleGenerateAudio} disabled={audioLoading}>
                        {audioLoading ? '⏳ Gerando Áudio...' : template === 'quiz-mobile' ? '🔊 Gerar Áudio Completo (~3s)' : '🔊 Gerar Narração com IA'}
                      </button>
                      {template === 'quiz-mobile' && (
                        !instantPlaying ? (
                          <button className="btn-secondary" type="button" onClick={handleInstantPreview}>⚡ Prévia Ao Vivo (Simulador)</button>
                        ) : (
                          <button className="btn-secondary" type="button" onClick={stopInstantPreview} style={{ color: '#f87171' }}>⏹ Parar Prévia</button>
                        )
                      )}
                      {isLocal && (
                        <button className="btn-secondary" type="button" onClick={handleLocalVideoCompile} disabled={localVideoLoading}>
                          {localVideoLoading ? '⏳ Compilando...' : '🎬 Preview GSAP (Local)'}
                        </button>
                      )}
                    </div>

                    {(audioLoading || audioProgress > 0) && (
                      <div className="progress-wrap">
                        <div className="progress-meta">
                          <span>{audioStatus || 'Processando áudio...'}</span>
                          <span style={{ color: audioProgress === 100 ? '#34d399' : '#a5b4fc' }}>{audioProgress}%</span>
                        </div>
                        <div className="progress-track">
                          <div className="progress-fill" style={{ width: `${audioProgress}%` }} />
                        </div>
                      </div>
                    )}
                    {!audioLoading && audioProgress === 0 && audioStatus && (
                      <div style={{ fontSize: '0.76rem', color: 'var(--text-muted)', marginTop: '8px' }}>{audioStatus}</div>
                    )}
                    {audioSrc && (
                      <audio ref={audioRef} src={audioSrc} controls style={{ width: '100%', marginTop: '10px' }} />
                    )}
                    {localVideoUrl && (
                      <div style={{ marginTop: '12px', textAlign: 'center' }}>
                        <iframe src={localVideoUrl} style={{ width: '300px', height: '533px', border: '2px solid var(--accent)', borderRadius: '14px', background: '#000' }} />
                      </div>
                    )}
                  </div>

                  <button className="btn-primary" type="button" onClick={handleDispatchRender} disabled={dispatchLoading}>
                    {dispatchLoading ? <div className="spinner" /> : <span>🚀</span>}
                    <span>{dispatchLoading ? 'Enviando para Esteira...' : 'Disparar Renderização na Esteira'}</span>
                  </button>
                </div>
              </div>

              {/* Coluna Direita */}
              <div>
                <div className="card">
                  <div className="step-header">
                    <div className="step-title"><span>📱 Preview Visual</span></div>
                    {template === 'quiz-mobile' && <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>{THEMES[visualTheme]?.label}</span>}
                  </div>
                  {template === 'quiz-mobile' ? (
                    <QuizPhonePreview
                      questions={questions}
                      activeIdx={activeIdx}
                      themeKey={visualTheme}
                      clockValue={simClock}
                      revealed={simRevealed}
                      onPrev={() => { setSimRevealed(false); setSimClock(5); setActiveIdx(i => (i - 1 + questions.length) % questions.length); }}
                      onNext={() => { setSimRevealed(false); setSimClock(5); setActiveIdx(i => (i + 1) % questions.length); }}
                      onToggleReveal={() => { setSimRevealed(v => !v); setSimClock(simRevealed ? 5 : 0); }}
                    />
                  ) : (
                    <SecondaryPreviewCard template={template} storyData={storyData} adData={adData} scriptText={scriptText} />
                  )}
                </div>

                <div className="card">
                  <div className="step-header">
                    <div className="step-title"><span>📊 Esteira em Tempo Real</span></div>
                    <button className="btn-secondary" type="button" onClick={() => fetchRuns()} style={{ padding: '4px 10px', fontSize: '0.73rem' }}>🔄 Atualizar</button>
                  </div>
                  <div className="tabs" style={{ marginBottom: '10px' }}>
                    {[['all', `Todos (${kpis.total})`], ['active', `Produção (${kpis.active})`], ['success', `Prontos (${kpis.success})`], ['fail', `Falhas (${kpis.fail})`]].map(([k, l]) => (
                      <button key={k} type="button" className={`tab-btn ${runFilter === k ? 'active' : ''}`} onClick={() => setRunFilter(k)} style={{ flex: 1, fontSize: '0.68rem', padding: '5px 3px' }}>{l}</button>
                    ))}
                  </div>
                  <div className="runs-list">
                    {!ghToken ? (
                      <div className="empty-state">Configure seu GitHub Token para acompanhar a esteira.</div>
                    ) : runsError ? (
                      <div className="empty-state" style={{ color: 'var(--danger)' }}>{runsError}</div>
                    ) : filteredRuns.length === 0 ? (
                      <div className="empty-state">Nenhuma execução nesta aba.</div>
                    ) : (
                      filteredRuns.map(run => {
                        let statusClass = 'status-queued', statusLabel = 'Na Fila', s1 = 'done', s2 = 'active', s3 = '';
                        if (run.status === 'in_progress') { statusClass = 'status-in_progress'; statusLabel = 'Em Produção...'; s2 = 'done'; s3 = 'active'; }
                        else if (run.status === 'completed') {
                          if (run.conclusion === 'success') { statusClass = 'status-completed'; statusLabel = 'Pronto!'; s2 = 'done'; s3 = 'done'; }
                          else { statusClass = 'status-failed'; statusLabel = 'Falhou'; s2 = 'done'; s3 = 'fail'; }
                        }
                        const created = new Date(run.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        const isDone = run.status === 'completed' && run.conclusion === 'success';
                        return (
                          <div key={run.id} className="run-item">
                            <div className="run-header">
                              <span className={`badge-status ${statusClass}`}>{statusLabel}</span>
                              <span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>{created}</span>
                            </div>
                            <div className="run-title">{run.display_title || 'Render Video'}</div>
                            <div className="run-meta">Execução #{run.run_number}</div>
                            <div className="pipeline-steps"><div className={`step-bar ${s1}`} /><div className={`step-bar ${s2}`} /><div className={`step-bar ${s3}`} /></div>
                            <div className="run-actions">
                              {isDone && (
                                <>
                                  <button type="button" className="run-btn" onClick={() => handlePlayRunAudio(run.id)}>🔊 Ouvir MP3</button>
                                  <button type="button" className="run-btn download" onClick={() => handleDownloadRun(run.id)}>⬇️ Baixar (.zip)</button>
                                </>
                              )}
                              <a href={run.html_url} target="_blank" rel="noreferrer" className="run-btn">Log</a>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
